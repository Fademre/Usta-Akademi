<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Usta Akademi</title>
<meta name="description" content="Dil öğren ve zekâ oyunlarıyla pratik zekânı geliştir.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Usta">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EDF1EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1512" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="stylesheet" href="fonts/fonts.css">
<script>try{var _s=JSON.parse(localStorage.getItem('usta-akademi-v1'));if(_s&&_s.skin&&_s.skin!=='classic')document.documentElement.setAttribute('data-skin',_s.skin);}catch(e){}</script>
<script>window.APP_VERSION='2.0';</script>
<style>
/* standalone shell: what the artifact host used to provide */
html{background:var(--bg,#EDF1EC);padding-top:env(safe-area-inset-top,0px);box-sizing:border-box;-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
input,textarea,select{font-size:16px}
</style>
</head>
<body>
<style>
/* Layout: one phone-width app column (topbar · scrolling screen · tab bar) with a full-screen lesson player layered on top. Blue = languages, felt green = mind games, marigold = XP and streaks. */
:root{
  --bg:#EDF1EC; --surface:#FFFFFF; --surface-2:#E1E7DF; --ink:#13201A; --muted:#5A6A61; --line:#D0D9CD;
  --lang:#2360C6; --lang-2:#18468F; --lang-soft:#DBE6F9;
  --game:#1C7A51; --game-2:#125638; --game-soft:#D3EDDE;
  --sun:#F0A01E; --sun-2:#B8740A; --sun-soft:#FCEACB;
  --good:#1E9853; --good-2:#13703B; --good-soft:#DCF2E4;
  --bad:#D6423A; --bad-2:#A22C25; --bad-soft:#FBE1DE;
  --sq-l:#EEE0C1; --sq-d:#B4835A; --wood:#E2C690; --wood-line:#9A7146;
  --piece-w:#FFFDF7; --piece-b:#1B1712; --on-acc:#FFFFFF;
  --felt:#2C8A5A; --felt-line:#17573A; --go-board:#E2B868; --go-line:#4E3518; --pit:#A57A45;
  --tv-a:#F1DFB6; --tv-b:#9B3A2C; --ck-w:#FBF6EA; --ck-b:#2A2420;
  --shadow:0 1px 2px rgba(19,32,26,.06),0 10px 30px rgba(19,32,26,.10);
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-glyph:"Segoe UI Symbol","DejaVu Sans","Noto Sans Symbols 2","Apple Symbols",serif;
  --acc:var(--lang); --acc-2:var(--lang-2); --acc-soft:var(--lang-soft);
  --bg-img:none;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1512; --surface:#17211C; --surface-2:#212D27; --ink:#E6EEE9; --muted:#93A39A; --line:#2B3932;
  --lang:#6A9FF3; --lang-2:#3F6FBF; --lang-soft:#1A2840;
  --game:#4DC08A; --game-2:#2E8A5E; --game-soft:#142E20;
  --sun:#F6B649; --sun-2:#B8801F; --sun-soft:#3A2B11;
  --good:#45C47C; --good-2:#2A8A52; --good-soft:#143022;
  --bad:#F06A5F; --bad-2:#B4433A; --bad-soft:#3A1916;
  --sq-l:#CDBB97; --sq-d:#8E6644; --wood:#BFA270; --wood-line:#7B5934;
  --piece-w:#FFFDF7; --piece-b:#14110D; --on-acc:#0E1512;
  --felt:#1F6A45; --felt-line:#0F3B26; --go-board:#B8924E; --go-line:#3A2610; --pit:#7D5A30;
  --tv-a:#CDB78B; --tv-b:#7A2C21; --ck-w:#F1EBDD; --ck-b:#1E1915;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1512; --surface:#17211C; --surface-2:#212D27; --ink:#E6EEE9; --muted:#93A39A; --line:#2B3932;
  --lang:#6A9FF3; --lang-2:#3F6FBF; --lang-soft:#1A2840;
  --game:#4DC08A; --game-2:#2E8A5E; --game-soft:#142E20;
  --sun:#F6B649; --sun-2:#B8801F; --sun-soft:#3A2B11;
  --good:#45C47C; --good-2:#2A8A52; --good-soft:#143022;
  --bad:#F06A5F; --bad-2:#B4433A; --bad-soft:#3A1916;
  --sq-l:#CDBB97; --sq-d:#8E6644; --wood:#BFA270; --wood-line:#7B5934;
  --piece-w:#FFFDF7; --piece-b:#14110D; --on-acc:#0E1512;
  --felt:#1F6A45; --felt-line:#0F3B26; --go-board:#B8924E; --go-line:#3A2610; --pit:#7D5A30;
  --tv-a:#CDB78B; --tv-b:#7A2C21; --ck-w:#F1EBDD; --ck-b:#1E1915;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;display:flex;justify-content:center;overflow:hidden;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.t-lang{--acc:var(--lang);--acc-2:var(--lang-2);--acc-soft:var(--lang-soft)}
.t-game{--acc:var(--game);--acc-2:var(--game-2);--acc-soft:var(--game-soft)}
.t-sun{--acc:var(--sun);--acc-2:var(--sun-2);--acc-soft:var(--sun-soft)}

.app{position:relative;width:100%;max-width:440px;height:100%;display:flex;flex-direction:column;overflow:hidden}
@media (min-width:560px){
  body{padding-block:24px;align-items:center}
  .app{height:min(100%,900px);border-radius:32px;border:1px solid var(--line);box-shadow:var(--shadow)}
}
.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.fill{fill:currentColor;stroke:none}
.ic .f{fill:currentColor;stroke:none}

/* top bar */
.topbar{display:flex;align-items:center;gap:10px;padding-block:14px 10px;background:transparent}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.02em;margin-right:auto}
.logo-mark{width:30px;height:30px;border-radius:9px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:18px;font-family:var(--f-glyph);line-height:1}
.chip{display:inline-flex;align-items:center;gap:5px;font-weight:800;font-size:14px;padding:6px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.chip .ic{width:18px;height:18px}
.chip.streak{color:var(--sun-2)}
.chip.xp{color:var(--lang)}
:root .chip.streak .num,:root .chip.xp .num{color:var(--ink)}
.chip.ui{gap:6px}

.screen{flex:1;overflow-y:auto;overflow-x:hidden;padding-block:6px 28px;scroll-behavior:smooth}
.stack{display:flex;flex-direction:column;gap:18px}
.tabbar{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding-block:8px calc(8px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:14px;font-size:12px;font-weight:700;color:var(--muted)}
.tab[aria-current="page"]{color:var(--ink);background:var(--surface-2)}
.tab[aria-current="page"] .ic{color:var(--acc)}

.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.h-xl{font-size:32px;line-height:1.05;font-weight:800}
.h-l{font-size:24px;line-height:1.1;font-weight:800}
.h-m{font-size:18px;line-height:1.2;font-weight:700}
.sub{color:var(--muted);font-size:15px;max-width:34ch}
.row{display:flex;align-items:center;gap:12px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:12px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:16px;font-weight:800;font-size:16px;letter-spacing:.01em;background:var(--acc);color:var(--on-acc);box-shadow:0 4px 0 var(--acc-2);transition:transform .08s,box-shadow .08s,filter .15s;text-transform:none}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--acc-2)}
.btn:disabled{background:var(--surface-2);color:var(--muted);box-shadow:0 4px 0 var(--line);cursor:default}
.btn.block{width:100%}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:0 4px 0 var(--line);border:1px solid var(--line)}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px;border-radius:12px;box-shadow:0 3px 0 var(--acc-2)}
.btn.ghost.sm{box-shadow:0 3px 0 var(--line)}

/* home */
.hero{display:flex;flex-direction:column;gap:6px;padding-top:6px}
.goal{display:flex;align-items:center;gap:14px}
.ring{width:64px;height:64px;flex:none}
.ring circle{fill:none;stroke-width:7}
.ring .track{stroke:var(--surface-2)}
.ring .bar{stroke:var(--sun);stroke-linecap:round;transition:stroke-dashoffset .6s}
.ring text{font:800 15px var(--f-display);fill:var(--ink)}
.continue{position:relative;overflow:hidden;background:var(--acc);color:var(--on-acc);border:0;border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:0 5px 0 var(--acc-2)}
.continue .eyebrow{color:inherit;opacity:.8}
.continue .h-l{color:inherit}
.continue .btn{background:var(--surface);color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.18);align-self:flex-start}
.continue .bigcode{position:absolute;right:-6px;top:-18px;font:800 110px/1 var(--f-display);opacity:.14;letter-spacing:-.05em;pointer-events:none}
.continue .meter{height:8px;border-radius:99px;background:rgba(255,255,255,.28);overflow:hidden}
.continue .meter i{display:block;height:100%;background:var(--on-acc);border-radius:99px}
.puzzle-card{display:grid;grid-template-columns:116px 1fr;gap:14px;align-items:center}
.puzzle-card .board{width:116px}
.hscroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;margin-inline:-4px;padding-inline:4px;scroll-snap-type:x mandatory}
.hscroll>*{scroll-snap-align:start}
.mini-game{flex:0 0 150px;display:flex;flex-direction:column;gap:10px;text-align:left}
.art{width:100%;aspect-ratio:1.4;border-radius:16px;background:var(--game-soft);display:grid;place-items:center;color:var(--game-2);overflow:hidden;position:relative}
:root .art .glyph{font:400 58px/1 var(--f-glyph);color:var(--game-2)}
.meter{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .5s}

/* languages */
.lang-chips{display:flex;flex-wrap:wrap;gap:8px}
.lchip{flex:none;display:flex;align-items:center;gap:8px;padding:8px 14px 8px 8px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);font-weight:700}
.lchip .code{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:800 11px var(--f-display);letter-spacing:.04em;background:var(--surface-2);color:var(--muted)}
.lchip[aria-pressed="true"]{border-color:var(--lang);background:var(--lang-soft)}
.lchip[aria-pressed="true"] .code{background:var(--lang);color:var(--on-acc)}
.level-head{display:flex;align-items:center;gap:12px}
.lvl-badge{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font:800 19px var(--f-display);background:var(--acc);color:var(--on-acc);box-shadow:0 4px 0 var(--acc-2);flex:none}
.lvl-badge.off{background:var(--surface-2);color:var(--muted);box-shadow:0 4px 0 var(--line)}
.unit{display:flex;flex-direction:column;gap:14px}
.unit-words{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.path{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;position:relative}
.path::before{content:"";position:absolute;left:10%;right:10%;top:25px;height:4px;border-radius:4px;background:var(--surface-2)}
.node{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--muted);text-align:center;line-height:1.15}
.node .dot{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);box-shadow:0 4px 0 var(--line);font:800 17px var(--f-display);transition:transform .1s}
.node.done .dot{background:var(--acc);color:var(--on-acc);box-shadow:0 4px 0 var(--acc-2)}
.node.cur .dot{background:var(--surface);color:var(--acc);border:3px solid var(--acc);box-shadow:0 4px 0 var(--acc-2);animation:pulse 1.8s ease-in-out infinite}
.node.cur{color:var(--ink)}
.node:active .dot{transform:translateY(3px)}
@keyframes pulse{0%,100%{outline:0 solid transparent}50%{outline:7px solid var(--acc-soft)}}
.locked-lvl{display:flex;align-items:center;gap:12px;opacity:.9}
.locked-lvl .txt{min-width:0;flex:1}
.topics{font-size:13.5px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.pill .ic{width:13px;height:13px}
.pill.ok{background:var(--good-soft);color:var(--good-2)}
:root .pill.ok{color:var(--good)}

/* games */
.game-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.game-card{display:flex;flex-direction:column;gap:10px;text-align:left;padding:12px}
.game-card.wide{grid-column:1/-1;display:grid;grid-template-columns:130px 1fr;align-items:center}
.game-card .art{aspect-ratio:1.25}
.soon-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.soon{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:16px;background:var(--surface);border:1px dashed var(--line);font-size:12.5px;font-weight:700;color:var(--muted);text-align:center}
.soon .glyph{font:400 26px/1 var(--f-glyph);color:var(--muted);height:28px;display:grid;place-items:center}
.lesson-list{display:flex;flex-direction:column;gap:0;position:relative}
.lesson{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;padding:10px 0;text-align:left;position:relative}
.lesson .dot{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);box-shadow:0 4px 0 var(--line);font:800 18px var(--f-display);position:relative;z-index:1}
.lesson.done .dot{background:var(--acc);color:var(--on-acc);box-shadow:0 4px 0 var(--acc-2)}
.lesson.cur .dot{background:var(--surface);color:var(--acc);border:3px solid var(--acc);box-shadow:0 4px 0 var(--acc-2);animation:pulse 1.8s ease-in-out infinite}
.lesson-list::before{content:"";position:absolute;left:24px;top:36px;bottom:36px;width:4px;border-radius:4px;background:var(--surface-2)}
.lesson .ttl{font-weight:700}
.lesson.locked .ttl{color:var(--muted)}
.back{display:inline-flex;align-items:center;gap:4px;font-weight:700;color:var(--muted);align-self:flex-start;padding:6px 8px 6px 0}

/* profile */
.avatar{width:64px;height:64px;border-radius:20px;background:var(--sun);color:var(--on-acc);display:grid;place-items:center;font:800 28px var(--f-display);box-shadow:0 4px 0 var(--sun-2)}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{display:flex;flex-direction:column;gap:2px;padding:14px}
.stat b{font:800 26px var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted);font-weight:600}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:5px;background:var(--surface-2);border-radius:16px}
.seg button{padding:10px 4px;border-radius:12px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 0 var(--line)}
.confirm{display:flex;flex-direction:column;gap:12px;background:var(--bad-soft);border-color:transparent}

/* player */
.player{position:absolute;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column}
.p-head{display:flex;align-items:center;gap:12px;padding-block:14px 8px}
.p-close{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--muted);flex:none}
.p-bar{flex:1;height:14px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.p-bar i{display:block;height:100%;width:0;border-radius:99px;background:var(--acc);transition:width .45s cubic-bezier(.3,1.3,.6,1);box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.hearts{display:flex;align-items:center;gap:4px;font-weight:800;color:var(--bad);font-variant-numeric:tabular-nums;min-width:40px;justify-content:flex-end}
.hearts .ic{width:22px;height:22px}
.p-body{flex:1;overflow-y:auto;padding-block:12px 20px;display:flex;flex-direction:column;gap:18px}
.p-foot{position:relative;padding-block:14px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column;gap:12px;transition:background .2s}
.p-foot.good{background:var(--good-soft);border-color:transparent;--acc:var(--good);--acc-2:var(--good-2)}
.p-foot.bad{background:var(--bad-soft);border-color:transparent;--acc:var(--bad);--acc-2:var(--bad-2)}
.fb-title{display:flex;align-items:center;gap:10px;font:800 20px var(--f-display)}
.p-foot.good .fb-title{color:var(--good-2)}
.p-foot.bad .fb-title{color:var(--bad-2)}
:root .p-foot.good .fb-title{color:var(--good)}
:root .p-foot.bad .fb-title{color:var(--bad)}
.fb-title .ic{width:30px;height:30px;padding:5px;border-radius:50%;background:currentColor}
.fb-title .ic path{stroke:var(--surface)}
.fb-detail{font-weight:600}
.hint{font-size:14px;color:var(--muted);text-align:center;font-weight:600}
.flash{position:absolute;left:50%;bottom:calc(100% + 10px);transform:translateX(-50%);max-width:calc(100% - 32px);width:max-content;background:var(--ink);color:var(--bg);font-weight:700;font-size:14px;padding:10px 14px;border-radius:14px;box-shadow:var(--shadow);animation:pop .25s ease-out;text-align:center;z-index:3}
.flash.good{background:var(--good);color:var(--on-acc)}
@keyframes pop{from{opacity:0;transform:translate(-50%,6px)}to{opacity:1;transform:translate(-50%,0)}}

.prompt{font-size:22px;line-height:1.2;font-weight:800}
.say{display:flex;align-items:center;gap:12px}
.spk{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--acc);color:var(--on-acc);box-shadow:0 4px 0 var(--acc-2);flex:none}
.spk:active{transform:translateY(3px);box-shadow:0 1px 0 var(--acc-2)}
.spk.big{width:96px;height:96px;border-radius:28px;margin:6px auto}
.spk.big .ic{width:44px;height:44px}
.intro{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:22px 16px}
.intro .emoji{font-size:84px;line-height:1.1}
.intro .tw{font:800 38px var(--f-display);letter-spacing:-.02em}
.intro .mean{font-size:18px;color:var(--muted);font-weight:600}
.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt-list{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:18px;background:var(--surface);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);font-weight:700;font-size:17px;text-align:left;transition:transform .08s}
.opt:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.opt.pic{flex-direction:column;justify-content:center;text-align:center;padding:16px 10px;gap:6px;min-height:128px}
.opt.pic .emoji{font-size:44px;line-height:1}
.opt[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft);box-shadow:0 3px 0 var(--acc)}
.opt .key{width:28px;height:28px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--muted);flex:none}
.opt[aria-pressed="true"] .key{border-color:var(--acc);color:var(--acc)}
.bubble{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:18px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:17px}
.bubble .emoji{font-size:34px;line-height:1}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:10px}
.match .opt{justify-content:center;text-align:center;min-height:58px;padding:10px}
.match .opt.ok{opacity:.35;border-color:var(--good);box-shadow:none;pointer-events:none}
.match .opt.no{border-color:var(--bad);background:var(--bad-soft);animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.sentence{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font:700 22px var(--f-display);line-height:1.3}
.blank{min-width:84px;padding:2px 10px;border-bottom:3px solid var(--acc);color:var(--acc);text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.tile{padding:10px 14px;border-radius:14px;background:var(--surface);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);font-weight:700;font-size:17px}
.tile[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft)}
.tile.ghost{background:var(--surface-2);color:transparent;box-shadow:none;border-color:var(--surface-2)}
.ans-line{min-height:116px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:10px;padding:12px 0;background-image:linear-gradient(var(--line),var(--line)),linear-gradient(var(--line),var(--line));background-size:100% 2px;background-repeat:no-repeat;background-position:0 56px,0 100%}
.type-in{width:100%;min-height:120px;resize:none;padding:14px 16px;border-radius:18px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:600 19px var(--f-body)}
.type-in:focus{border-color:var(--acc);outline:none}
.keys{display:flex;flex-wrap:wrap;gap:6px}
.keys button{min-width:40px;height:40px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:17px}
.reveal{font-size:14px;font-weight:700;color:var(--acc);text-decoration:underline;align-self:center}
.info-text{font-size:17px;line-height:1.55;max-width:60ch}
.rows{display:flex;flex-direction:column;gap:8px}
.rows .r{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-weight:700}
.rows .r .g{font:400 26px/1 var(--f-glyph);text-align:center}
.rows .r b{font:800 20px var(--f-display);color:var(--acc);font-variant-numeric:tabular-nums}

/* boards */
.board-wrap{display:flex;justify-content:center}
.board{width:min(100%,360px);aspect-ratio:1;max-width:100%;display:grid;grid-template-columns:repeat(8,1fr);border-radius:12px;overflow:hidden;box-shadow:0 0 0 4px var(--wood-line),var(--shadow);user-select:none}
.board.small{border-radius:8px;box-shadow:0 0 0 3px var(--wood-line)}
.sq{position:relative;display:grid;place-items:center;background:var(--sq-l)}
.sq.d{background:var(--sq-d)}
.board.dama .sq{background:var(--wood);box-shadow:inset 0 0 0 .5px var(--wood-line)}
.sq.sel{background:color-mix(in srgb,var(--sun) 55%,var(--sq-l))}
.board.dama .sq.sel{background:color-mix(in srgb,var(--sun) 55%,var(--wood))}
.sq.hl{background:color-mix(in srgb,var(--bad) 40%,var(--sq-l))}
.sq.hl.d{background:color-mix(in srgb,var(--bad) 45%,var(--sq-d))}
.sq .crd{position:absolute;font-size:9px;font-weight:800;opacity:.7;color:var(--piece-b);line-height:1}
.sq .crd.f{right:3px;bottom:2px}
.sq .crd.r{left:3px;top:2px}
.board.small .crd{display:none}
.pc{font:400 min(9vw,38px)/1 var(--f-glyph);position:relative;z-index:1;transition:transform .15s}
.board.small .pc{font-size:12px}
.pc.w{color:var(--piece-w);-webkit-text-stroke:1.4px var(--piece-b);paint-order:stroke fill;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.pc.b{color:var(--piece-b);text-shadow:0 1px 0 rgba(255,255,255,.25)}
.disc{width:76%;height:76%;border-radius:50%;position:relative;z-index:1;display:grid;place-items:center;font:400 13px/1 var(--f-glyph)}
.disc.w{background:radial-gradient(circle at 35% 30%,#fff,#E9E2D2);box-shadow:0 3px 0 #A99C82,inset 0 0 0 3px rgba(0,0,0,.06)}
.disc.b{background:radial-gradient(circle at 35% 30%,#4B4036,#1C1712);box-shadow:0 3px 0 #000,inset 0 0 0 3px rgba(255,255,255,.06);color:#F3D27A}
.disc.w.k{color:#B07A10}
.disc.k::after{content:"♛";font-size:min(4.6vw,20px)}
.board.small .disc.k::after{font-size:8px}
.dotm{position:absolute;width:28%;height:28%;border-radius:50%;background:rgba(20,30,25,.32);z-index:2;pointer-events:none}
.ringm{position:absolute;inset:6%;border-radius:50%;border:4px solid rgba(20,30,25,.38);z-index:2;pointer-events:none}
.starm{position:absolute;inset:16%;color:var(--sun);z-index:0;filter:drop-shadow(0 2px 0 var(--sun-2))}
.starm .ic{width:100%;height:100%}
.sq button.hit{position:absolute;inset:0;z-index:3}

/* ludo */
.strip{display:grid;gap:6px}
.cell{position:relative;aspect-ratio:1;border-radius:50%;background:var(--surface);border:2px solid var(--line);display:grid;place-items:center}
.cell.home{background:var(--game-soft);border-color:var(--game)}
.cell.star::before{content:"";position:absolute;inset:18%;background:var(--sun);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);opacity:.8}
.cell .num{position:absolute;bottom:-17px;font-size:10px;font-weight:700;color:var(--muted)}
.pawn{width:70%;height:70%;border-radius:50%;position:relative;z-index:1}
.pawn.me{background:var(--lang);box-shadow:0 3px 0 var(--lang-2),inset 0 0 0 4px rgba(255,255,255,.25);animation:bob 1.2s ease-in-out infinite}
.pawn.opp{background:var(--bad);box-shadow:0 3px 0 var(--bad-2),inset 0 0 0 4px rgba(255,255,255,.2)}
@keyframes bob{50%{transform:translateY(-3px)}}
.ludo-top{display:flex;align-items:center;justify-content:center;gap:14px;font-weight:700}
.die{width:64px;height:64px;border-radius:16px;background:var(--surface);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:9px;gap:2px}
.die i{border-radius:50%;background:transparent;margin:2px}
.die i.on{background:var(--ink)}
.die.big{width:110px;height:110px;border-radius:26px;padding:16px;margin:0 auto}
.die.rolling{animation:roll .5s linear infinite}
@keyframes roll{to{transform:rotate(360deg)}}
.ludo-svg{width:min(100%,300px);margin:0 auto;display:block}
.ludo-svg .bd{fill:var(--surface);stroke:var(--line);stroke-width:.06}
.ludo-svg .tr{fill:var(--surface);stroke:var(--muted);stroke-width:.05}
.ludo-svg .ca{fill:var(--sun)} .ludo-svg .cb{fill:var(--game)} .ludo-svg .cc{fill:var(--bad)} .ludo-svg .cd{fill:var(--lang)}
.ludo-svg .soft{opacity:.35}

/* result */
.result{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;position:relative}
.medal{width:120px;height:120px;border-radius:36px;background:var(--sun);color:var(--on-acc);display:grid;place-items:center;box-shadow:0 6px 0 var(--sun-2);animation:medal .6s cubic-bezier(.3,1.6,.5,1)}
.medal .ic{width:64px;height:64px}
.medal.sad{background:var(--bad);box-shadow:0 6px 0 var(--bad-2)}
@keyframes medal{from{transform:scale(.4) rotate(-12deg);opacity:0}}
.res-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:320px}
.res-stats .stat{border-radius:18px;border:2px solid var(--line);background:var(--surface);align-items:center}
.res-stats .stat:first-child b{color:var(--sun-2)}
:root .res-stats .stat:first-child b{color:var(--sun)}
canvas.confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.sheet-bg{position:absolute;inset:0;z-index:30;background:rgba(10,16,13,.45);display:flex;align-items:flex-end;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;background:var(--surface);border-radius:26px 26px 0 0;padding-block:20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px)}}
.toast{position:absolute;left:50%;bottom:88px;transform:translateX(-50%);z-index:25;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:700;font-size:14px;box-shadow:var(--shadow);animation:pop .25s;width:max-content;max-width:calc(100% - 32px);text-align:center}
.center{text-align:center}
/* v2: swipe, voices, new games */
.screen{touch-action:pan-y;user-select:none;-webkit-user-select:none}
.view-in-l{animation:inL .3s cubic-bezier(.2,.8,.3,1)}
.view-in-r{animation:inR .3s cubic-bezier(.2,.8,.3,1)}
@keyframes inL{from{transform:translateX(-48px);opacity:0}}
@keyframes inR{from{transform:translateX(48px);opacity:0}}
.spk-wrap{display:flex;align-items:center;gap:8px}
.spk-wrap.big{flex-direction:column;gap:10px}
.slow{min-height:40px;padding:0 14px;border-radius:12px;background:var(--surface);border:2px solid var(--line);font-weight:800;font-size:13px;color:var(--acc);box-shadow:0 3px 0 var(--line)}
.slow:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.sentence .word{font:inherit;color:inherit;padding:0 2px;border-radius:6px;border-bottom:2px dotted var(--line)}
.sentence .word:active{background:var(--acc-soft)}
button.bubble{text-align:left;width:100%;color:var(--ink)}
button.tw{color:var(--ink)}
.ro{font-size:14px;color:var(--muted);font-weight:600;font-style:italic}
.gfx{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:4}
.pawn.me.hop{animation:hop .19s ease-out}
@keyframes hop{50%{transform:translateY(-10px) scale(1.1)}}
.switch{position:relative;width:52px;height:30px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--good)}
.switch[aria-checked="true"]::after{transform:translateX(22px)}
.select{width:100%;min-height:42px;padding:0 10px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px var(--f-body)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.settings{display:flex;flex-direction:column;gap:16px}
/* reversi */
.rv{display:grid;width:min(100%,360px);max-width:100%;aspect-ratio:1;background:var(--felt-line);border-radius:12px;padding:4px;gap:2px;box-shadow:0 0 0 4px var(--felt-line),var(--shadow)}
.rv .c{position:relative;background:var(--felt);border-radius:3px;display:grid;place-items:center;perspective:300px}
.rv .c button{position:absolute;inset:0;z-index:2}
.rvd{width:80%;height:80%;border-radius:50%;display:block}
.rvd.b{background:radial-gradient(circle at 35% 30%,#4a4a4a,#0d0d0d);box-shadow:0 3px 0 rgba(0,0,0,.45)}
.rvd.w{background:radial-gradient(circle at 35% 30%,#fff,#dcdcdc);box-shadow:0 3px 0 rgba(0,0,0,.35)}
.rvd.drop{animation:drop .28s cubic-bezier(.3,1.5,.6,1)}
.rvd.flip.b{animation:flipB .5s ease-in-out backwards}
.rvd.flip.w{animation:flipW .5s ease-in-out backwards}
@keyframes drop{from{transform:scale(1.7);opacity:0}}
@keyframes flipB{0%{transform:rotateY(0);background:#e6e6e6}49%{transform:rotateY(90deg);background:#e6e6e6}51%{transform:rotateY(90deg);background:#151515}100%{transform:rotateY(0);background:#151515}}
@keyframes flipW{0%{transform:rotateY(0);background:#151515}49%{transform:rotateY(90deg);background:#151515}51%{transform:rotateY(90deg);background:#e6e6e6}100%{transform:rotateY(0);background:#e6e6e6}}
.hintdot{width:26%;height:26%;border-radius:50%;background:rgba(255,255,255,.4)}
.score{display:flex;justify-content:center;gap:18px;font-weight:800;font-variant-numeric:tabular-nums}
.score span{display:inline-flex;align-items:center;gap:6px}
.sw{width:16px;height:16px;border-radius:50%;display:inline-block}
.sw.b{background:#151515}.sw.w{background:#ececec;box-shadow:inset 0 0 0 1px #999}
/* sudoku */
.sd{display:grid;width:min(100%,360px);max-width:100%;aspect-ratio:1;border:3px solid var(--ink);border-radius:10px;overflow:hidden;background:var(--surface)}
.sd .c{display:grid;place-items:center;font:700 clamp(15px,5.4vw,26px) var(--f-display);border-right:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--ink);background:var(--surface);min-width:0}
.sd.n9 .c{font-size:clamp(13px,4.2vw,20px)}
.sd .c.br{border-right:2.5px solid var(--ink)}
.sd .c.bb{border-bottom:2.5px solid var(--ink)}
.sd .c.given{background:var(--surface-2)}
.sd .c.user{color:var(--acc)}
.sd .c.peer{background:var(--acc-soft)}
.sd .c.same{background:color-mix(in srgb,var(--acc) 30%,var(--surface))}
.sd .c.sel{background:color-mix(in srgb,var(--sun) 55%,var(--surface))}
.sd .c.bad{animation:shake .35s;background:var(--bad-soft);color:var(--bad)}
.sd .c.pop{animation:pop2 .32s}
@keyframes pop2{50%{transform:scale(1.4)}}
.numpad{display:grid;gap:8px}
.numpad button{min-height:50px;border-radius:14px;background:var(--surface);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);font:800 22px var(--f-display)}
.numpad button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.numpad button.doneN{opacity:.3}
/* mangala */
.mg{display:grid;grid-template-columns:minmax(0,1.15fr) repeat(6,minmax(0,1fr)) minmax(0,1.15fr);grid-template-rows:auto auto;gap:7px 5px;padding:10px 8px 14px;border-radius:24px;background:var(--wood);box-shadow:0 0 0 4px var(--wood-line),var(--shadow);width:100%}
.pit{position:relative;aspect-ratio:1;border-radius:50%;background:var(--pit);box-shadow:inset 0 4px 8px rgba(0,0,0,.35);display:block;transition:transform .15s}
.store{grid-row:1/3;border-radius:999px;background:var(--pit);box-shadow:inset 0 4px 10px rgba(0,0,0,.35);position:relative;min-height:110px}
.pit .n,.store .n{position:absolute;font:800 11px var(--f-body);color:var(--ink);background:var(--surface);border-radius:99px;padding:1px 6px;bottom:-7px;left:50%;transform:translateX(-50%);z-index:2;font-variant-numeric:tabular-nums;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.store .n{bottom:6px;font-size:13px}
.stone{position:absolute;width:24%;height:24%;border-radius:50%;box-shadow:inset -1px -2px 0 rgba(0,0,0,.28),0 1px 1px rgba(0,0,0,.2)}
.store .stone{width:22%;height:auto;aspect-ratio:1}
.pit.mine{outline:3px solid transparent}
.pit.mine:hover{outline-color:var(--acc)}
.pit.land,.store.land{animation:land .22s}
.pit.hot{box-shadow:inset 0 4px 8px rgba(0,0,0,.35),0 0 0 4px var(--sun)}
@keyframes land{50%{transform:scale(1.14)}}
.mg-labels{display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
/* go */
.gb{display:grid;width:min(100%,360px);max-width:100%;aspect-ratio:1;background:var(--go-board);border-radius:10px;padding:2.5%;box-shadow:0 0 0 4px var(--go-line),var(--shadow)}
.gb .p{position:relative;display:grid;place-items:center}
.gb .p::before{content:"";position:absolute;left:0;right:0;top:50%;height:1.5px;background:var(--go-line);transform:translateY(-50%)}
.gb .p::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:1.5px;background:var(--go-line);transform:translateX(-50%)}
.gb .p.l::before{left:50%}.gb .p.r::before{right:50%}.gb .p.t::after{top:50%}.gb .p.b::after{bottom:50%}
.gb .hoshi{position:absolute;width:16%;height:16%;border-radius:50%;background:var(--go-line);z-index:1}
.gs{width:88%;height:88%;border-radius:50%;position:relative;z-index:2;display:block}
.gs.b{background:radial-gradient(circle at 35% 30%,#555,#0b0b0b);box-shadow:0 2px 2px rgba(0,0,0,.5)}
.gs.w{background:radial-gradient(circle at 35% 30%,#fff,#d6d6d6);box-shadow:0 2px 2px rgba(0,0,0,.4)}
.gs.drop{animation:drop .24s cubic-bezier(.3,1.5,.6,1)}
.lib{width:32%;height:32%;border-radius:50%;background:var(--sun);z-index:2;box-shadow:0 0 0 3px color-mix(in srgb,var(--sun) 35%,transparent)}
.gb .p button{position:absolute;inset:0;z-index:3}
/* game card art */
.art-mg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:60%;padding:8px;border-radius:14px;background:var(--wood)}
.art-mg span{position:relative;aspect-ratio:1;border-radius:50%;background:var(--pit);box-shadow:inset 0 3px 6px rgba(0,0,0,.3)}
.art-sd{display:grid;grid-template-columns:repeat(3,1fr);width:54%;aspect-ratio:1;border:2.5px solid var(--game-2);border-radius:8px;overflow:hidden;background:var(--surface)}
.art-sd span{display:grid;place-items:center;font:800 15px var(--f-display);color:var(--game-2);border:1px solid var(--game-soft)}
.art-rv{display:grid;grid-template-columns:1fr 1fr;gap:4px;width:50%;padding:6px;border-radius:10px;background:var(--felt)}
.art-rv .rvd{width:100%;height:auto;aspect-ratio:1}
.art-go{position:relative;width:58%;aspect-ratio:1;border-radius:8px;background-color:var(--go-board);background-image:linear-gradient(var(--go-line) 1.5px,transparent 1.5px),linear-gradient(90deg,var(--go-line) 1.5px,transparent 1.5px);background-size:26% 26%;background-position:center}
.art-go .gs{position:absolute;width:30%;height:30%}
/* v1.3: tavla, okey, memory */
.tv{display:grid;grid-template-columns:repeat(6,minmax(0,1fr)) minmax(0,.75fr) repeat(6,minmax(0,1fr)) minmax(0,.8fr);grid-template-rows:minmax(0,1fr) auto minmax(0,1fr);width:100%;aspect-ratio:.95;background:var(--wood);border:6px solid var(--wood-line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.tp{position:relative;display:flex;flex-direction:column;align-items:center;padding:2px 1px}
.tp::before{content:"";position:absolute;inset:0 6%;background:var(--tv-b);clip-path:polygon(0 0,100% 0,50% 92%)}
.tp.a::before{background:var(--tv-a)}
.tp.bot{flex-direction:column-reverse}
.tp.bot::before{clip-path:polygon(50% 8%,100% 100%,0 100%)}
.tp .pn{position:absolute;font-size:9px;font-weight:800;color:var(--wood-line);z-index:1;left:0;right:0;text-align:center}
.tp.top .pn{bottom:2px}.tp.bot .pn{top:2px}
.tp.sel{background:color-mix(in srgb,var(--sun) 35%,transparent)}
.tp.tg::after{content:"";position:absolute;left:50%;width:44%;aspect-ratio:1;border-radius:50%;transform:translateX(-50%);background:var(--sun);box-shadow:0 0 0 4px color-mix(in srgb,var(--sun) 40%,transparent);z-index:3;animation:pulse2 1s ease-in-out infinite}
.tp.top.tg::after{bottom:14%}.tp.bot.tg::after{top:14%}
@keyframes pulse2{50%{transform:translateX(-50%) scale(1.25)}}
.stk{position:relative;z-index:2;display:flex;flex-direction:inherit;align-items:center;width:100%;gap:1px}
.ck{display:grid;place-items:center;width:88%;max-width:30px;aspect-ratio:1;border-radius:50%;font:800 10px var(--f-body);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25),0 1px 2px rgba(0,0,0,.35)}
.ck.w{background:var(--ck-w);color:var(--ck-b);border:1.5px solid #B9AA88}
.ck.b{background:var(--ck-b);color:var(--ck-w);border:1.5px solid #000}
.tbar{position:relative;background:var(--wood-line);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:4px 0}
.tbar.top{justify-content:flex-start}
.tbar.sel{box-shadow:inset 0 0 0 3px var(--sun)}
.tmid{grid-column:1/14;grid-row:2;display:flex;align-items:center;justify-content:center;gap:10px;padding:6px 0;background:color-mix(in srgb,var(--wood-line) 25%,var(--wood));min-height:44px}
.tmid .die{width:34px;height:34px;border-radius:9px;padding:5px;box-shadow:0 2px 0 var(--line)}
.tmid .die.used{opacity:.3}
.toff{grid-column:14;grid-row:1/4;position:relative;background:var(--wood-line);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;padding:8px 0;color:var(--ck-w)}
.toff .pn{font-size:16px;font-weight:800}
.toff b{font:800 18px var(--f-display);background:var(--ck-w);color:var(--ck-b);border-radius:8px;padding:2px 6px}
.toff.tg{box-shadow:inset 0 0 0 3px var(--sun);background:color-mix(in srgb,var(--sun) 35%,var(--wood-line))}
.tp button,.tbar button,.toff button{position:absolute;inset:0;z-index:4}
.rack{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:12px 8px 16px;border-radius:14px;background:linear-gradient(var(--wood),color-mix(in srgb,var(--wood) 78%,#000));box-shadow:0 4px 0 var(--wood-line)}
.otile{width:40px;height:56px;border-radius:7px;background:#FBF6EA;box-shadow:0 3px 0 #C9BC9F,0 4px 6px rgba(0,0,0,.2);display:flex;flex-direction:column;align-items:center;justify-content:center;font:800 21px/1 var(--f-display);transition:transform .15s,box-shadow .15s;flex:none}
.otile::after{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;margin-top:4px}
.otile.r{color:#C9302C}.otile.y{color:#C98500}.otile.b{color:#1F5FC4}.otile.k{color:#1C1C1C}
.otile.f{color:#1E7A4E}.otile.f::after{display:none}
.otile.sm{width:30px;height:42px;font-size:16px;border-radius:6px}
.otile.sm::after{width:5px;height:5px;margin-top:3px}
.otile[aria-pressed="true"]{transform:translateY(-10px);box-shadow:0 3px 0 var(--sun),0 10px 14px rgba(0,0,0,.25)}
.ogroups{display:flex;flex-wrap:wrap;gap:14px 10px;padding-top:8px}
.ogroup{position:relative;display:flex;gap:3px;padding:10px 8px 8px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line)}
button.ogroup{cursor:pointer}
button.ogroup:active{border-color:var(--acc)}
.ogroup.pop{animation:pop2 .35s}
.ogroup .lbl{position:absolute;top:-10px;left:8px;font-size:11px;font-weight:800;background:var(--good);color:var(--on-acc);padding:1px 7px;border-radius:99px;white-space:nowrap}
.ind{display:flex;align-items:center;gap:10px;font-weight:700}
.mm{display:grid;gap:8px;width:100%}
.card3d{position:relative;aspect-ratio:.82;perspective:700px}
.card3d .in{position:absolute;inset:0;transition:transform .42s cubic-bezier(.3,1.2,.5,1);transform-style:preserve-3d}
.card3d.up .in,.card3d.ok .in{transform:rotateY(180deg)}
.card3d .fr,.card3d .bk{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center}
.card3d .bk{background-color:var(--acc);background-image:radial-gradient(circle,rgba(255,255,255,.28) 2px,transparent 3px);background-size:14px 14px;box-shadow:0 3px 0 var(--acc-2)}
.card3d .fr{background:var(--surface);border:2px solid var(--line);transform:rotateY(180deg);font-size:clamp(22px,7.5vw,36px)}
.card3d.ok .fr{border-color:var(--good);background:var(--good-soft)}
.card3d button{position:absolute;inset:0;z-index:2}
.simon{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:min(100%,300px);margin:0 auto}
.pad{aspect-ratio:1;border-radius:26px;opacity:.5;transition:opacity .1s,transform .1s;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.pad:nth-child(1){background:var(--lang)}.pad:nth-child(2){background:var(--game)}.pad:nth-child(3){background:var(--sun)}.pad:nth-child(4){background:var(--bad)}
.pad.on{opacity:1;transform:scale(1.05)}
.span-num{font:800 clamp(30px,10vw,48px) var(--f-display);letter-spacing:.1em;text-align:center;font-variant-numeric:tabular-nums;padding:18px 0}
.span-in{min-height:0!important;text-align:center;font:800 28px var(--f-display)!important;letter-spacing:.15em}
.ms-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ms-grid div{aspect-ratio:1;border-radius:16px;background:var(--surface);border:2px solid var(--line);display:grid;place-items:center;font-size:clamp(30px,10vw,44px)}
.ms-grid div.q{color:var(--muted);font:800 36px var(--f-display);border-style:dashed;border-color:var(--acc)}
.rounds{display:flex;justify-content:center;gap:6px}
.rounds i{width:10px;height:10px;border-radius:50%;background:var(--surface-2)}
.rounds i.on{background:var(--acc)}
.art-tv{position:relative;display:grid;grid-template-columns:repeat(6,1fr);width:70%;height:62%;background:var(--wood);border:3px solid var(--wood-line);border-radius:8px;overflow:hidden}
.art-tv span{clip-path:polygon(0 0,100% 0,50% 90%);background:var(--tv-b)}
.art-tv span.a{background:var(--tv-a)}
.art-tv .ck{position:absolute;bottom:8%;width:22%;max-width:none}
.art-rack{padding:8px 8px 10px;gap:4px;position:relative}
.art-101{position:absolute;right:-8px;top:-12px;font:800 13px var(--f-display);background:var(--bad);color:var(--on-acc);padding:2px 7px;border-radius:99px}
.art-mm{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:50%}
.art-mm span{aspect-ratio:.82;border-radius:8px;display:grid;place-items:center;font-size:22px}
.art-mm .fr{background:var(--surface);border:2px solid var(--line)}
.art-mm .bk{background:var(--game);background-image:radial-gradient(circle,rgba(255,255,255,.28) 2px,transparent 3px);background-size:10px 10px}

/* v1.5: answer animations, step entrance, page slides, level tabs */
.view-ghost{position:absolute;left:0;right:0;overflow:hidden;pointer-events:none;z-index:6}
.p-body>*{animation:stepIn .38s cubic-bezier(.2,.8,.3,1) backwards}
.p-body>:nth-child(2){animation-delay:.05s}.p-body>:nth-child(3){animation-delay:.1s}.p-body>:nth-child(4){animation-delay:.15s}
@keyframes stepIn{from{opacity:0;transform:translateX(26px)}}
.opt-grid>.opt,.opt-list>.opt,.chips>.tile[data-v]{animation:optIn .42s cubic-bezier(.2,.9,.3,1.25) backwards}
@keyframes optIn{from{opacity:0;transform:translateY(16px) scale(.94)}}
.opt,.tile{position:relative}
.opt[aria-pressed="true"],.tile[aria-pressed="true"]{animation:optPick .24s ease-out}
@keyframes optPick{50%{transform:scale(1.045)}}
.opt.right,.tile.right{border-color:var(--good);background:var(--good-soft);box-shadow:0 3px 0 var(--good);animation:optRight .55s cubic-bezier(.3,1.6,.5,1)}
.opt.right .key{border-color:var(--good);color:var(--good)}
.opt.wrong,.tile.wrong{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 3px 0 var(--bad);animation:shake .42s}
.opt.dim,.tile.dim{opacity:.4;transition:opacity .3s}
.opt.right::after{content:"✓";position:absolute;right:12px;top:50%;margin-top:-13px;width:26px;height:26px;border-radius:50%;background:var(--good);color:var(--on-acc);display:grid;place-items:center;font:800 15px var(--f-body);animation:badgeIn .4s cubic-bezier(.3,1.8,.5,1) .1s backwards}
.opt.pic.right::after{top:8px;right:8px;margin-top:0}
@keyframes optRight{0%{transform:scale(1)}35%{transform:scale(1.07)}100%{transform:scale(1)}}
@keyframes badgeIn{from{transform:scale(0)}}

  {type:'quiz',q:T("Ev yolunun sonuna 2 kare kaldı ve zar 5 geldi. Ne olur?","Two squares are left to the end of the home lane and you roll a 5. What happens?","Bis zum Ende der Hausreihe sind es 2 Felder, du würfelst 5. Was passiert?"),opts:[T("O taş hareket edemez","That piece can't move","Die Figur kann nicht ziehen"),T("Taş eve girer","The piece gets home","Die Figur kommt ins Haus"),T("Taş başa döner","The piece goes back to start","Die Figur muss zum Start")],a:0}]},
 {title:T("Strateji ipuçları","Strategy tips","Strategietipps"),steps:[
  {type:'info',text:T("Rakibin hemen arkanda durmasın: 1–6 kare arkandaki rakip seni kızdırabilir. Riskli taşını uzaklaştır, güvenli taşını sonra oynat.","Don't stay just ahead of an opponent: one 1–6 squares behind you can knock you out. Move the piece in danger first.","Bleib nicht knapp vor einem Gegner: Steht er 1–6 Felder hinter dir, kann er dich rauswerfen. Zieh zuerst die gefährdete Figur.")},
  {type:'ludo',cells:16,mine:[7,11],opp:[5],dice:4,correct:7,text:T("Zar 4 geldi. Hangi taşını kurtarmalısın?","You rolled a 4. Which piece should you save?","Du hast eine 4. Welche Figur solltest du retten?"),whyWrong:T("Olmadı: 8. karedeki taşın rakibin sadece 2 önünde, hâlâ tehlikede.","Not quite: your piece on square 8 is only 2 ahead of the opponent and still in danger.","Nicht ganz: Deine Figur auf Feld 8 steht nur 2 vor dem Gegner und ist in Gefahr."),success:T("Akıllıca! Artık rakibin 6 kare önündesin.","Smart! Now you're 6 squares ahead of the opponent.","Klug! Jetzt bist du 6 Felder vor dem Gegner.")},
  {type:'quiz',q:T("Rakip 2 kare arkanda. Hangisi daha güvenli?","An opponent is 2 squares behind you. Which is safer?","Ein Gegner steht 2 Felder hinter dir. Was ist sicherer?"),opts:[T("Uzaklaşmak","Move away","Wegziehen"),T("Yerinde kalmak","Stay put","Stehen bleiben")],a:0}]}
];
