const MANGALA=[
 {title:T("Tahta ve amaç","Board and goal","Brett und Ziel"),steps:[
  {type:'info',text:T("Mangala iki kişilik eski bir Türk zekâ oyunudur. Her oyuncunun önünde 6 kuyu, sağında da bir hazine vardır. Her kuyuda 4 taşla başlanır, toplam 48 taş. Oyun sonunda hazinesinde en çok taş olan kazanır.","Mangala is an old two-player Turkish strategy game. Each player has 6 pits in front and a treasury on the right. Every pit starts with 4 stones, 48 in total. Whoever has the most stones in their treasury at the end wins.","Mangala ist ein altes türkisches Strategiespiel für zwei. Jeder hat 6 Mulden vor sich und rechts eine Schatzkammer. Anfangs liegen in jeder Mulde 4 Steine, insgesamt 48. Wer am Ende die meisten Steine in der Schatzkammer hat, gewinnt."),visual:{kind:'mangala'}},
  {type:'quiz',q:T("Başlangıçta her kuyuda kaç taş vardır?","How many stones start in each pit?","Wie viele Steine liegen anfangs in jeder Mulde?"),opts:['3','4','6'],a:1},
  {type:'quiz',q:T("Hazinen hangi tarafındadır?","Where is your treasury?","Wo ist deine Schatzkammer?"),opts:[T("Sağımda","On my right","Rechts"),T("Solumda","On my left","Links")],a:0}]},
 {title:T("Taş dağıtma","Sowing","Säen"),steps:[
  {type:'info',text:T("Kendi kuyularından birini seç ve içindeki bütün taşları al. İlk taşı aynı kuyuya bırak, kalanları sağa doğru (saatin tersi yönünde) birer birer dağıt. Kuyuda tek taş varsa onu yanındaki kuyuya taşırsın.","Pick one of your pits and take all its stones. Drop the first stone back into the same pit, then sow the rest one by one to the right (counterclockwise). If the pit holds a single stone, move it to the next pit.","Nimm alle Steine aus einer deiner Mulden. Leg den ersten zurück in dieselbe Mulde und verteile den Rest einzeln nach rechts (gegen den Uhrzeigersinn). Liegt nur ein Stein darin, kommt er in die nächste Mulde.")},
  {type:'mangala',goal:'any',text:T("Bir kuyuna dokun ve taşların dağılışını izle.","Tap one of your pits and watch the stones being sown.","Tippe eine deiner Mulden an und sieh zu, wie gesät wird.")},
  {type:'quiz',q:T("5 taşlı bir kuyudan dağıtım yapınca o kuyuda kaç taş kalır?","After sowing from a pit with 5 stones, how many stay in it?","Wie viele Steine bleiben nach dem Säen aus einer Mulde mit 5 Steinen darin?"),opts:['0','1','5'],a:1}]},
 {title:T("Bir hamle daha","Extra turn","Extrazug"),steps:[
  {type:'info',text:T("Elindeki son taş kendi hazinene düşerse bir hamle daha oynarsın. Saymayı unutma: taş aldığın kuyu 1. sayılır.","If your last stone lands in your own treasury, you play again. Remember: the pit you start from counts as number 1.","Landet dein letzter Stein in deiner Schatzkammer, bist du nochmal dran. Denk dran: Die Startmulde zählt als Nummer 1.")},
  {type:'mangala',goal:'extra',me:[1,3,2,5,4,2],text:T("Son taşı hazinene düşür ve bir hamle daha kazan.","Land your last stone in your treasury to earn another turn.","Lass den letzten Stein in deiner Schatzkammer landen."),whyWrong:T("Son taş hazinene düşmedi. Tekrar say.","The last stone missed your treasury. Count again.","Der letzte Stein hat die Schatzkammer verfehlt. Zähl nochmal.")},
  {type:'quiz',q:T("Son taş hazinene düşerse ne olur?","What happens when your last stone lands in your treasury?","Was passiert, wenn dein letzter Stein in deiner Schatzkammer landet?"),opts:[T("Bir hamle daha oynarım","I play again","Ich ziehe nochmal"),T("Sıra rakibe geçer","My opponent moves","Der Gegner ist dran"),T("Oyun biter","The game ends","Das Spiel endet")],a:0}]},
 {title:T("Çift yapma","Making it even","Gerade machen"),steps:[
  {type:'info',text:T("Son taşın rakibin kuyusuna düşer ve oradaki taş sayısı çift olursa (2, 4, 6…) o kuyudaki bütün taşları hazinene alırsın.","If your last stone lands in an opponent's pit and makes its count even (2, 4, 6…), you take all the stones in that pit.","Landet dein letzter Stein in einer gegnerischen Mulde und ist die Anzahl dann gerade (2, 4, 6 …), gehören dir alle Steine darin.")},
  {type:'mangala',goal:'even',opp:[3,4,5,3,4,4],text:T("Rakibin bir kuyusunu çift yap ve taşları al.","Make one of your opponent's pits even and take the stones.","Mach eine gegnerische Mulde gerade und nimm die Steine."),whyWrong:T("Bu hamle çift yapmadı. Rakibin tek sayılı kuyularına bak.","That didn't make an even pit. Look at your opponent's odd pits.","Das ergab keine gerade Zahl. Schau auf die ungeraden Mulden des Gegners.")},
  {type:'quiz',q:T("Son taşın rakibin 3 taşlı kuyusuna düştü. Ne olur?","Your last stone lands in an opponent's pit that had 3 stones. What happens?","Dein letzter Stein landet in einer gegnerischen Mulde mit 3 Steinen. Was passiert?"),opts:[T("4 taşı da alırım","I take all 4","Ich nehme alle 4"),T("Hiçbir şey","Nothing","Nichts"),T("Rakip 4 taşı alır","My opponent takes 4","Der Gegner nimmt 4")],a:0}]},
 {title:T("Boş kuyu","Empty pit","Leere Mulde"),steps:[
  {type:'info',text:T("Son taşın kendi tarafındaki boş bir kuyuya düşerse ve karşısındaki rakip kuyusunda taş varsa, iki kuyudaki taşların hepsini hazinene alırsın.","If your last stone lands in an empty pit on your side and the opponent's pit opposite has stones, you take the stones from both pits.","Landet dein letzter Stein in einer leeren Mulde auf deiner Seite und liegen gegenüber Steine, nimmst du die Steine aus beiden Mulden.")},
  {type:'mangala',goal:'empty',me:[2,0,3,0,1,4],text:T("Son taşı boş bir kuyuna düşür ve karşıdaki taşları al.","Land your last stone in one of your empty pits and take the stones opposite.","Lass den letzten Stein in einer deiner leeren Mulden landen."),whyWrong:T("Son taş boş bir kuyuna düşmedi. Tekrar say.","The last stone didn't land in one of your empty pits. Count again.","Der letzte Stein ist nicht in einer leeren Mulde gelandet. Zähl nochmal.")}]},
 {title:T("Mini maç","Mini match","Minimatch"),steps:[
  {type:'info',text:T("Şimdi bilgisayara karşı oyna! Bir oyuncunun kuyuları boşalınca oyun biter; kuyularını ilk boşaltan, rakibin tarafındaki taşları da alır.","Now play the computer! The game ends when one side's pits are empty; whoever empties their side first also takes the stones left on the other side.","Jetzt gegen den Computer! Das Spiel endet, wenn eine Seite leer ist; wer zuerst leer ist, bekommt auch die restlichen Steine der anderen Seite.")},
  {type:'mangala',goal:'match',text:T("Bilgisayara karşı oyna.","Play against the computer.","Spiel gegen den Computer.")}]}
];
const SUDOKU=[
 {title:T("Kurallar","The rules","Die Regeln"),steps:[
  {type:'info',text:T("Sudoku bir sayı bulmacasıdır. Her satırda, her sütunda ve kalın çizgili her kutuda her sayı yalnızca bir kez bulunur. 4×4 sudokuda 1–4, klasik sudokuda 1–9 kullanılır.","Sudoku is a number puzzle. Every row, every column and every bold box contains each number exactly once. A 4×4 sudoku uses 1–4, the classic one 1–9.","Sudoku ist ein Zahlenrätsel. In jeder Zeile, jeder Spalte und jedem dick umrandeten Kasten steht jede Zahl genau einmal. 4×4-Sudoku nutzt 1–4, das klassische 1–9."),visual:{kind:'sudoku',n:4}},
  {type:'quiz',q:T("Bir satırda aynı sayı kaç kez bulunabilir?","How many times can a number appear in a row?","Wie oft darf eine Zahl in einer Zeile stehen?"),opts:['1','2',T("İstediği kadar","Any number of times","Beliebig oft")],a:0},
  {type:'quiz',q:T("Klasik sudokuda hangi sayılar kullanılır?","Which numbers does classic sudoku use?","Welche Zahlen nutzt klassisches Sudoku?"),opts:['1–4','1–6','1–9'],a:2}]},
 {title:T("İlk bulmacan","Your first puzzle","Dein erstes Rätsel"),steps:[
  {type:'sudoku',n:4,blanks:4,text:T("Boş kareleri doldur.","Fill in the empty squares.","Fülle die leeren Felder.")},
  {type:'sudoku',n:4,blanks:6,text:T("Bir tane daha!","One more!","Noch eins!")}]},
 {title:T("Eksik olanı bul","Find what's missing","Finde, was fehlt"),steps:[
  {type:'info',text:T("İpucu: Bir satırda tek boş kare kaldıysa eksik sayıyı bulmak kolaydır. Önce en dolu satıra, sütuna ya da kutuya bak.","Tip: if a row has only one empty square, the missing number is easy to find. Start with the fullest row, column or box.","Tipp: Fehlt in einer Zeile nur ein Feld, ist die Zahl leicht zu finden. Beginne mit der vollsten Zeile, Spalte oder dem vollsten Kasten.")},
  {type:'sudoku',n:4,blanks:9,text:T("Daha çok boşluk var. En dolu satırdan başla.","More gaps this time. Start with the fullest row.","Mehr Lücken. Beginne mit der vollsten Zeile.")}]},
 {title:T("6×6 sudoku","6×6 sudoku","6×6-Sudoku"),steps:[
  {type:'info',text:T("6×6 sudokuda kutular 2 satır ve 3 sütundan oluşur; 1–6 arası sayılar kullanılır.","In 6×6 sudoku the boxes are 2 rows by 3 columns, and you use 1–6.","Beim 6×6-Sudoku sind die Kästen 2 Zeilen × 3 Spalten groß, mit den Zahlen 1–6."),visual:{kind:'sudoku',n:6}},
  {type:'sudoku',n:6,blanks:10,text:T("6×6 bulmacayı çöz.","Solve the 6×6 puzzle.","Löse das 6×6-Rätsel.")}]},
 {title:T("Klasik 9×9","Classic 9×9","Klassisch 9×9"),steps:[
  {type:'info',text:T("Artık gerçek sudoku! Bir kare için her sayıyı dene: satırda, sütunda ya da kutuda varsa o sayı olamaz. Tek aday kalırsa cevap odur.","Now the real thing! For a square, test each number: if it is already in the row, column or box, it can't go there. When one candidate is left, that's the answer.","Jetzt das echte Sudoku! Prüfe für ein Feld jede Zahl: Steht sie schon in Zeile, Spalte oder Kasten, scheidet sie aus. Bleibt eine übrig, ist sie die Lösung.")},
  {type:'sudoku',n:9,blanks:12,text:T("İlk 9×9 bulmacan.","Your first 9×9 puzzle.","Dein erstes 9×9-Rätsel.")}]},
 {title:T("Usta bulmaca","Master puzzle","Meisterrätsel"),steps:[
  {type:'sudoku',n:9,blanks:24,text:T("Daha zor bir 9×9. Acele etme!","A harder 9×9. Take your time!","Ein schwereres 9×9. Lass dir Zeit!")}]}
];
const REVERSI=[
 {title:T("Tahta ve amaç","Board and goal","Brett und Ziel"),steps:[
  {type:'info',text:T("Reversi 8×8 tahtada, bir yüzü siyah bir yüzü beyaz taşlarla oynanır. Ortada 4 taşla başlanır ve siyah ilk oynar. Tahta dolunca rengi en çok olan kazanır.","Reversi is played on an 8×8 board with discs that are black on one side and white on the other. It starts with 4 discs in the middle and black moves first. When the board is full, the colour with the most discs wins.","Reversi wird auf einem 8×8-Brett mit Steinen gespielt, die eine schwarze und eine weiße Seite haben. Es beginnt mit 4 Steinen in der Mitte, Schwarz zieht zuerst. Ist das Brett voll, gewinnt die Farbe mit den meisten Steinen."),visual:{kind:'reversi',b:['d5','e4'],w:['d4','e5']}},
  {type:'quiz',q:T("İlk hamleyi kim yapar?","Who moves first?","Wer zieht zuerst?"),opts:[T("Siyah","Black","Schwarz"),T("Beyaz","White","Weiß")],a:0},
  {type:'quiz',q:T("Oyun kaç taşla başlar?","How many discs are on the board at the start?","Wie viele Steine liegen am Anfang?"),opts:['2','4','8'],a:1}]},
 {title:T("Taş çevirme","Flipping","Umdrehen"),steps:[
  {type:'info',text:T("Taşını, rakip taşlar senin iki taşının arasında kalacak şekilde koy. Aradaki bütün taşlar senin rengine döner. Her hamle en az bir taş çevirmek zorundadır.","Place your disc so that opponent discs are trapped between two of yours. All trapped discs flip to your colour. Every move must flip at least one disc.","Setz deinen Stein so, dass gegnerische Steine zwischen zwei deiner Steine liegen. Sie werden alle umgedreht. Jeder Zug muss mindestens einen Stein umdrehen.")},
  {type:'reversi',goal:'any',b:['d5','e4'],w:['d4','e5'],text:T("İlk hamleni yap. Noktalar oynayabileceğin yerleri gösterir.","Make your first move. The dots show where you can play.","Mach deinen ersten Zug. Die Punkte zeigen, wo du setzen kannst.")},
  {type:'reversi',goal:'flipN',need:2,b:['b4','b6'],w:['c4','d4','c5'],text:T("Tek hamlede 2 taş çevir.","Flip 2 discs in one move.","Dreh mit einem Zug 2 Steine um."),whyWrong:T("Bu hamle sadece 1 taş çevirdi. Daha iyisini bul!","That only flipped 1 disc. Find a better move!","Das hat nur 1 Stein umgedreht. Finde einen besseren Zug!")}]},
 {title:T("Çok yönlü çevirme","Many directions","Mehrere Richtungen"),steps:[
  {type:'info',text:T("Bir hamle aynı anda birden çok yönde taş çevirebilir: yatay, dikey ve çapraz.","One move can flip discs in several directions at once: across, up and down, and diagonally.","Ein Zug kann gleichzeitig in mehrere Richtungen umdrehen: waagerecht, senkrecht und diagonal.")},
  {type:'reversi',goal:'flipN',need:3,b:['b4','f4','d6'],w:['c4','e4','d5'],text:T("Tek hamlede 3 taş çevir.","Flip 3 discs in one move.","Dreh mit einem Zug 3 Steine um."),whyWrong:T("Daha fazlasını çevirebilirsin. Üç yöne birden bakan kareyi bul.","You can flip more. Find the square that looks three ways at once.","Da geht mehr. Finde das Feld, das in drei Richtungen wirkt.")}]},
 {title:T("Köşeler","Corners","Ecken"),steps:[
  {type:'info',text:T("Köşeye konan taş bir daha asla çevrilemez. Bu yüzden köşeler tahtanın en değerli kareleridir.","A disc in a corner can never be flipped again. That makes corners the most valuable squares.","Ein Stein in der Ecke kann nie mehr umgedreht werden. Deshalb sind Ecken die wertvollsten Felder.")},
  {type:'reversi',goal:'solve',b:['c6','e3'],w:['b7','d4','e4'],solutions:['a8'],text:T("En iyi hamleyi bul.","Find the best move.","Finde den besten Zug."),whyWrong:T("Fena değil, ama köşeyi alabilirdin!","Not bad, but you could take a corner!","Nicht schlecht, aber du hättest eine Ecke nehmen können!"),success:T("Köşe senin! Bu taş artık hiç çevrilemez.","The corner is yours! That disc can never be flipped.","Die Ecke gehört dir! Dieser Stein ist sicher.")},
  {type:'quiz',q:T("Köşedeki bir taş çevrilebilir mi?","Can a disc in the corner be flipped?","Kann ein Eckstein umgedreht werden?"),opts:YESNO,a:1}]},
 {title:T("Mini maç","Mini match","Minimatch"),steps:[
  {type:'info',text:T("6×6 tahtada bilgisayara karşı oyna. Oynayacak yerin yoksa sıra rakibe geçer.","Play the computer on a 6×6 board. If you have no legal move, your turn passes.","Spiel auf einem 6×6-Brett gegen den Computer. Hast du keinen Zug, musst du passen.")},
  {type:'reversi',goal:'match',size:6,b:['c3','d4'],w:['c4','d3'],text:T("Bilgisayara karşı oyna.","Play against the computer.","Spiel gegen den Computer.")}]}
];
const GO=[
 {title:T("Tahta ve amaç","Board and goal","Brett und Ziel"),steps:[
  {type:'info',text:T("Go, taşların çizgilerin kesiştiği noktalara konduğu çok eski bir strateji oyunudur. Siyah başlar, sırayla birer taş konur ve taşlar bir daha hareket etmez. Amaç daha çok alan çevirmek ve rakip taşları yakalamaktır. Yeni başlayanlar 9×9 tahtada oynar.","Go is an ancient strategy game where stones go on the intersections of the lines. Black starts, players take turns placing one stone, and stones never move. The goal is to surround more territory and capture enemy stones. Beginners play on a 9×9 board.","Go ist ein uraltes Strategiespiel, bei dem Steine auf die Kreuzungspunkte gesetzt werden. Schwarz beginnt, abwechselnd wird ein Stein gesetzt, und Steine bewegen sich nie. Ziel ist es, mehr Gebiet zu umschließen und Steine zu fangen. Anfänger spielen auf 9×9."),visual:{kind:'go',b:['c3','e5','g7'],w:['c7','g3']}},
  {type:'quiz',q:T("Go'da taşlar nereye konur?","Where are stones placed in Go?","Wohin setzt man die Steine beim Go?"),opts:[T("Karelerin içine","Inside the squares","In die Felder"),T("Çizgilerin kesişimlerine","On the intersections","Auf die Kreuzungspunkte"),T("Sadece kenarlara","Only on the edges","Nur an den Rand")],a:1},
  {type:'quiz',q:T("Konulan taş sonra hareket eder mi?","Does a stone move after it is placed?","Bewegt sich ein Stein, nachdem er gesetzt wurde?"),opts:YESNO,a:1}]},
 {title:T("Özgürlükler","Liberties","Freiheiten"),steps:[
  {type:'info',text:T("Bir taşın hemen yanındaki (çapraz olmayan) boş noktalar onun özgürlükleridir. Ortadaki taşın 4, kenardakinin 3, köşedekinin 2 özgürlüğü vardır. Sarı noktalar özgürlükleri gösteriyor.","The empty points directly next to a stone (not diagonal) are its liberties. A stone in the middle has 4, on the edge 3, in the corner 2. The yellow dots show the liberties.","Die leeren Punkte direkt neben einem Stein (nicht diagonal) sind seine Freiheiten. In der Mitte hat er 4, am Rand 3, in der Ecke 2. Die gelben Punkte zeigen die Freiheiten."),visual:{kind:'go',b:['e5','a5','a1'],libs:true}},
  {type:'quiz',q:T("Köşedeki bir taşın kaç özgürlüğü vardır?","How many liberties does a corner stone have?","Wie viele Freiheiten hat ein Eckstein?"),opts:['2','3','4'],a:0},
  {type:'quiz',q:T("Çapraz noktalar özgürlük sayılır mı?","Do diagonal points count as liberties?","Zählen diagonale Punkte als Freiheiten?"),opts:YESNO,a:1}]},
 {title:T("Taş yakalama","Capturing a stone","Einen Stein fangen"),steps:[
  {type:'info',text:T("Bir taşın bütün özgürlüklerini kapatırsan onu yakalarsın ve tahtadan alırsın.","Fill all of a stone's liberties and you capture it: it is removed from the board.","Besetzt du alle Freiheiten eines Steins, fängst du ihn und nimmst ihn vom Brett.")},
  {type:'go',goal:'captureAll',b:['e6','d5','f5'],w:['e5'],text:T("Beyaz taşı yakala.","Capture the white stone.","Fang den weißen Stein.")},
  {type:'go',goal:'captureAll',b:['a6','b5'],w:['a5'],text:T("Kenardaki taşı yakala.","Capture the stone on the edge.","Fang den Stein am Rand.")}]},
 {title:T("Grup yakalama","Capturing a group","Eine Gruppe fangen"),steps:[
  {type:'info',text:T("Düz çizgiyle birbirine bağlı taşlar bir grup olur ve özgürlüklerini paylaşır. Grubu yakalamak için ortak özgürlüklerin hepsini kapat.","Stones connected along the lines form a group and share their liberties. To capture a group, fill all of its shared liberties.","Entlang der Linien verbundene Steine bilden eine Gruppe und teilen ihre Freiheiten. Um sie zu fangen, besetze alle gemeinsamen Freiheiten.")},
  {type:'go',goal:'captureAll',b:['d6','e6','c5','f5','d4'],w:['d5','e5'],text:T("İki taşlık beyaz grubu yakala.","Capture the white group of two.","Fang die weiße Zweiergruppe.")},
  {type:'go',goal:'captureAll',b:['a2','b2','c2'],w:['a1','b1','c1'],text:T("Kenardaki üç taşı tek hamlede yakala.","Capture the three edge stones in one move.","Fang die drei Steine am Rand mit einem Zug.")}]},
 {title:T("Atari ve kaçış","Atari and escape","Atari und Flucht"),steps:[
  {type:'info',text:T("Tek özgürlüğü kalan taş “atari”dedir: bir sonraki hamlede yakalanabilir. Taşını o son özgürlüğe doğru uzatarak kurtarabilirsin.","A stone with only one liberty left is in “atari”: it can be captured next move. Save it by extending into that last liberty.","Ein Stein mit nur einer Freiheit steht im „Atari“ und kann im nächsten Zug gefangen werden. Rette ihn, indem du in die letzte Freiheit verlängerst.")},
  {type:'go',goal:'solve',b:['e5'],w:['e6','d5','f5'],solutions:['e4'],text:T("Siyah taşın atari'de. Kurtar!","Your black stone is in atari. Save it!","Dein schwarzer Stein steht im Atari. Rette ihn!"),whyWrong:T("Taşın hâlâ tek özgürlükle duruyor. Son özgürlüğüne uzat.","Your stone still has only one liberty. Extend into its last liberty.","Dein Stein hat immer noch nur eine Freiheit. Verlängere in die letzte Freiheit."),success:T("Kurtuldun! Artık 3 özgürlüğün var.","Saved! Now you have 3 liberties.","Gerettet! Jetzt hast du 3 Freiheiten.")},
  {type:'quiz',q:T("Atari ne demektir?","What does atari mean?","Was bedeutet Atari?"),opts:[T("Tek özgürlük kaldı","Only one liberty left","Nur noch eine Freiheit"),T("Oyun bitti","The game is over","Spiel vorbei"),T("Köşeye taş koymak","Playing in the corner","In die Ecke setzen")],a:0}]},
 {title:T("Yasak nokta","Forbidden points","Verbotene Punkte"),steps:[
  {type:'info',text:T("Özgürlüğü olmayacak bir noktaya taş koyamazsın; buna intihar denir. Tek istisna: o hamle rakip taşları yakalıyorsa oynayabilirsin.","You can't place a stone where it would have no liberties; that is suicide. The one exception: if the move captures enemy stones, it is allowed.","Du darfst keinen Stein ohne Freiheiten setzen, das wäre Selbstmord. Ausnahme: Der Zug fängt gegnerische Steine.")},
  {type:'go',goal:'captureAll',b:['a3','b2','c1'],w:['a2','b1'],text:T("Köşe noktası yasak gibi görünüyor… İki beyaz taşı yakala!","The corner point looks forbidden… capture both white stones!","Der Eckpunkt sieht verboten aus … fang beide weißen Steine!")},
  {type:'quiz',q:T("Taşın hiç özgürlüğü kalmayacaksa ne olur?","What if your stone would have no liberties?","Was, wenn dein Stein keine Freiheiten hätte?"),opts:[T("Rakibi yakalamıyorsa oynanamaz","Not allowed unless it captures","Nur erlaubt, wenn er fängt"),T("Her zaman oynanabilir","Always allowed","Immer erlaubt")],a:0}]}
];
const TAVLA=[
 {title:T("Tahta ve diziliş","Board and setup","Brett und Aufstellung"),steps:[
  {type:'info',text:T("Tavla 24 haneli (üçgenli) bir tahtada iki kişiyle oynanır. Her oyuncunun 15 pulu vardır. Sen beyaz pullarla oynarsın ve pullarını 24'ten 1'e doğru ilerletirsin. 1–6 arası haneler senin iç bölgendir. Amaç bütün pullarını iç bölgene getirip tahtadan toplamaktır.","Backgammon is played by two on a board with 24 points (triangles). Each player has 15 checkers. You play white and move from point 24 towards point 1. Points 1–6 are your home board. The goal is to bring all your checkers home and bear them off.","Backgammon spielen zwei auf einem Brett mit 24 Zungen (Dreiecken). Jeder hat 15 Steine. Du spielst Weiß und ziehst von Feld 24 Richtung Feld 1. Die Felder 1–6 sind dein Heimfeld. Ziel ist es, alle Steine nach Hause zu bringen und auszuwürfeln."),visual:{kind:'tavla'}},
  {type:'quiz',q:T("Her oyuncunun kaç pulu vardır?","How many checkers does each player have?","Wie viele Steine hat jeder?"),opts:['12','15','16'],a:1},
  {type:'quiz',q:T("Tavla tahtasında kaç hane vardır?","How many points are on the board?","Wie viele Zungen hat das Brett?"),opts:['12','24','30'],a:1},
  {type:'quiz',q:T("Oyunu kim kazanır?","Who wins the game?","Wer gewinnt?"),opts:[T("Bütün pullarını ilk toplayan","The first to bear off all checkers","Wer zuerst alle Steine ausgewürfelt hat"),T("En çok pul kıran","Whoever hits the most","Wer am meisten schlägt"),T("En büyük zarı atan","The highest roll","Wer am höchsten würfelt")],a:0}]},
 {title:T("Zar ve hareket","Dice and moving","Würfel und Ziehen"),steps:[
  {type:'info',text:T("İki zar atılır ve her zar ayrı bir hamledir. Bir pulu iki zarın toplamı kadar ya da iki farklı pulu birer zarla ilerletebilirsin. Bir pula dokununca gidebileceği haneler parlar.","You roll two dice and each die is a separate move. Move one checker by both dice, or two checkers by one die each. Tap a checker and the points it can reach light up.","Du würfelst mit zwei Würfeln, jeder Würfel ist ein eigener Zug. Zieh einen Stein um beide Würfel oder zwei Steine um je einen. Tippe einen Stein an, dann leuchten seine Zielfelder.")},
  {type:'tavla',goal:'useAll',dice:[5,3],text:T("Zar 5–3 geldi. İki zarı da oyna.","You rolled 5–3. Play both dice.","Du hast 5–3. Spiele beide Würfel.")},
  {type:'tavla',goal:'useAll',dice:[6,1],text:T("Şimdi 6–1. İki zarı da oyna.","Now 6–1. Play both dice.","Jetzt 6–1. Spiele beide Würfel.")}]},
 {title:T("Kapı ve kırma","Blocks and hits","Blockieren und Schlagen"),steps:[
  {type:'info',text:T("Rakibin 2 ya da daha fazla pulu olan haneye (kapıya) gidemezsin. Rakibin tek pulu olan haneye gelirsen o pulu kırarsın; kırılan pul bara çıkar ve oyuna baştan girmek zorunda kalır.","You can't land on a point with 2 or more opponent checkers (a block). If you land on a point with a single opponent checker, you hit it: it goes to the bar and has to start again.","Auf ein Feld mit 2 oder mehr gegnerischen Steinen darfst du nicht. Landest du auf einem Feld mit nur einem gegnerischen Stein, schlägst du ihn: Er muss auf die Bar und von vorn beginnen.")},
  {type:'tavla',goal:'hit',dice:[3,2],w:{13:3,8:2,6:4,4:2},b:{10:1,5:2,19:5,17:3,12:4},text:T("Zar 3–2. Rakibin açıkta kalan pulunu kır!","You rolled 3–2. Hit your opponent's lone checker!","Du hast 3–2. Schlag den einzelnen gegnerischen Stein!"),whyWrong:T("Rakip pulu kıramadın. 10. hanedeki tek pula bak.","You didn't hit. Look at the lone checker on point 10.","Nicht geschlagen. Schau auf den einzelnen Stein auf Feld 10.")},
  {type:'quiz',q:T("Rakibin 2 pulu olan haneye gidebilir misin?","Can you land on a point with 2 opponent checkers?","Darfst du auf ein Feld mit 2 gegnerischen Steinen ziehen?"),opts:YESNO,a:1}]},
 {title:T("Kırık pulu sokmak","Entering from the bar","Von der Bar einwürfeln"),steps:[
  {type:'info',text:T("Kırık pulun varsa önce onu oyuna sokmalısın. Pul rakibin iç bölgesine (19–24) girer: zar 1 ise 24'e, zar 6 ise 19'a. Girdiğin hane kapalıysa o zarla giremezsin.","If you have a checker on the bar, you must enter it first. It enters your opponent's home board (19–24): a 1 enters on 24, a 6 on 19. You can't enter on a blocked point.","Hast du einen Stein auf der Bar, musst du ihn zuerst einwürfeln. Er kommt ins gegnerische Heimfeld (19–24): eine 1 auf 24, eine 6 auf 19. Auf ein blockiertes Feld geht es nicht.")},
  {type:'tavla',goal:'enter',bar:1,dice:[4,3],w:{13:4,8:3,6:5,5:2},b:{22:2,20:2,19:3,12:4,17:3,1:1},text:T("Zar 4–3. Kırık pulunu oyuna sok.","You rolled 4–3. Enter your checker from the bar.","Du hast 4–3. Würfle deinen Stein von der Bar ein.")},
  {type:'quiz',q:T("Kırık pulun varken başka bir pul oynayabilir misin?","Can you move another checker while one is on the bar?","Darfst du ziehen, während ein Stein auf der Bar ist?"),opts:YESNO,a:1}]},
 {title:T("Çift zar","Doubles","Pasch"),steps:[
  {type:'info',text:T("İki zar aynı gelirse (çift), o sayıyı 4 kez oynarsın. Örneğin 3–3 gelirse dört kez 3 hane ilerlersin.","If both dice show the same number (doubles), you play that number 4 times. With 3–3 you move 3 points four times.","Zeigen beide Würfel dieselbe Zahl (Pasch), spielst du sie viermal. Bei 3–3 ziehst du viermal 3 Felder.")},
  {type:'tavla',goal:'useAll',dice:[3,3],text:T("Zar 3–3 (çift). Dört hamle yap.","You rolled 3–3 (doubles). Make four moves.","Du hast 3–3 (Pasch). Mach vier Züge.")},
  {type:'quiz',q:T("Zar 4–4 gelirse toplam kaç hane ilerlersin?","With 4–4, how many points do you move in total?","Wie viele Felder ziehst du bei 4–4 insgesamt?"),opts:['8','16','4'],a:1}]},
 {title:T("Pul toplama","Bearing off","Auswürfeln"),steps:[
  {type:'info',text:T("Bütün pulların iç bölgendeyse (1–6) toplamaya başlarsın. Zar kaç ise o hanedeki pulu tahtadan çıkarırsın. Zar, en uzaktaki pulundan büyükse en uzaktaki pulu toplarsın. Bütün pullarını ilk toplayan kazanır.","When all your checkers are in your home board (1–6), you start bearing off. A die removes a checker from the matching point. If the die is higher than your farthest checker, you bear that one off. First to bear off everything wins.","Sind alle Steine im Heimfeld (1–6), beginnt das Auswürfeln. Ein Würfel nimmt einen Stein vom passenden Feld. Ist die Zahl höher als dein entferntester Stein, nimmst du diesen. Wer zuerst alle draußen hat, gewinnt.")},
  {type:'tavla',goal:'bearoff',need:2,dice:[6,3],w:{6:2,5:3,3:2,2:3,1:5},b:{24:3,22:4,20:4,19:4},text:T("Zar 6–3. İki pul topla. Sağdaki ok alanına dokunarak pul çıkarırsın.","You rolled 6–3. Bear off two checkers by tapping the arrow area on the right.","Du hast 6–3. Würfle zwei Steine aus, indem du auf den Pfeilbereich rechts tippst."),whyWrong:T("İki pul toplayamadın. 6 ve 3 numaralı hanelerden topla.","You didn't bear off two. Take them from points 6 and 3.","Nicht zwei ausgewürfelt. Nimm sie von Feld 6 und 3.")},
  {type:'quiz',q:T("Pul toplamaya ne zaman başlayabilirsin?","When can you start bearing off?","Wann darfst du auswürfeln?"),opts:[T("Bütün pullarım iç bölgedeyken","When all my checkers are home","Wenn alle Steine im Heimfeld sind"),T("İstediğim zaman","Whenever I like","Jederzeit"),T("Çift zar atınca","After rolling doubles","Nach einem Pasch")],a:0}]}
];
const OKEY=[
 {title:T("Taşlar","The tiles","Die Steine"),steps:[
  {type:'info',text:T("Okey 106 taşla oynanır: 4 renk (kırmızı, sarı, mavi, siyah), her renkte 1'den 13'e kadar ikişer taş ve 2 sahte okey (★). Her oyuncu 14 taş alır; başlayan oyuncu 15 taş alır ve bir taş atarak oyunu başlatır.","Okey uses 106 tiles: 4 colours (red, yellow, blue, black), two of each number 1–13 in every colour, plus 2 false jokers (★). Everyone gets 14 tiles; the starting player gets 15 and begins by discarding one.","Okey wird mit 106 Steinen gespielt: 4 Farben (rot, gelb, blau, schwarz), jede Zahl von 1 bis 13 zweimal pro Farbe, dazu 2 falsche Joker (★). Jeder bekommt 14 Steine, wer beginnt, 15 und legt zuerst einen ab."),visual:{kind:'okey',tiles:['r1','y5','b9','k13','f','r12','b3']}},
  {type:'quiz',q:T("Okey kaç taşla oynanır?","How many tiles are in Okey?","Wie viele Steine hat Okey?"),opts:['52','106','108'],a:1},
  {type:'quiz',q:T("Kaç farklı renk vardır?","How many colours are there?","Wie viele Farben gibt es?"),opts:['2','4','5'],a:1},
  {type:'quiz',q:T("Başlayan oyuncu kaç taş alır?","How many tiles does the starting player get?","Wie viele Steine bekommt, wer beginnt?"),opts:['14','15','21'],a:1}]},
 {title:T("Gösterge ve okey","Indicator and joker","Anzeiger und Joker"),steps:[
  {type:'info',text:T("Ortada açılan taşa gösterge denir. Okey, göstergenin aynı renkte bir fazlasıdır: gösterge sarı 7 ise okey sarı 8'dir; gösterge 13 ise okey 1'dir. Okey her taşın yerine geçebilir. Sahte okey (★) ise okey taşının yerine kullanılır.","The tile turned face up is the indicator. The joker (okey) is the next number in the same colour: if the indicator is yellow 7, the joker is yellow 8; after 13 comes 1. The joker can stand for any tile. The false joker (★) stands for the joker tile itself.","Der aufgedeckte Stein ist der Anzeiger. Der Joker (Okey) ist die nächste Zahl in derselben Farbe: Bei gelb 7 ist gelb 8 der Joker, nach 13 kommt 1. Der Joker ersetzt jeden Stein. Der falsche Joker (★) ersetzt den Jokerstein selbst.")},
  {type:'okey',mode:'pick',ind:'y7',rack:['y6','r8','y8','b8','y9','k7'],correct:[2],text:T("Gösterge sarı 7. Elindeki okey taşını bul.","The indicator is yellow 7. Find the joker in your rack.","Der Anzeiger ist gelb 7. Finde den Joker in deiner Bank."),whyWrong:T("Okey göstergenin aynı renkte bir fazlasıdır.","The joker is one higher, in the same colour.","Der Joker ist eins höher, in derselben Farbe.")},
  {type:'okey',mode:'pick',ind:'k13',rack:['k12','b13','r1','k1','k2'],correct:[3],text:T("Gösterge siyah 13. Okey hangisi?","The indicator is black 13. Which tile is the joker?","Der Anzeiger ist schwarz 13. Welcher Stein ist der Joker?"),whyWrong:T("13'ten sonra 1 gelir, renk aynı kalır.","After 13 comes 1, same colour.","Nach 13 kommt 1, gleiche Farbe.")},
  {type:'quiz',q:T("Gösterge mavi 10 ise okey nedir?","If the indicator is blue 10, what is the joker?","Ist der Anzeiger blau 10, was ist der Joker?"),opts:[T("Mavi 11","Blue 11","Blau 11"),T("Mavi 9","Blue 9","Blau 9"),T("Kırmızı 11","Red 11","Rot 11")],a:0}]},
 {title:T("Per ve seri","Sets and runs","Sätze und Reihen"),steps:[
  {type:'info',text:T("Per: aynı sayının farklı renkleri (3 ya da 4 taş), örneğin kırmızı 5, sarı 5, siyah 5. Seri: aynı rengin sıralı sayıları (en az 3 taş), örneğin mavi 3-4-5.","Set: the same number in different colours (3 or 4 tiles), e.g. red 5, yellow 5, black 5. Run: consecutive numbers in one colour (at least 3), e.g. blue 3-4-5.","Satz: dieselbe Zahl in verschiedenen Farben (3 oder 4 Steine), z. B. rot 5, gelb 5, schwarz 5. Reihe: aufeinanderfolgende Zahlen einer Farbe (mindestens 3), z. B. blau 3-4-5."),visual:{kind:'okey',groups:[['r5','y5','k5'],['b3','b4','b5']]}},
  {type:'okey',mode:'group',goal:'all',rack:['b4','r5','k10','y5','b3','k9','k5','b5','k11'],text:T("Bütün taşları gruplara ayır.","Split all tiles into groups.","Teile alle Steine in Gruppen auf."),whyWrong:T("Kalan taşlar grup olmuyor. Mavi 5 nereye ait?","The tiles left can't form a group. Where does blue 5 belong?","Die übrigen Steine passen nicht. Wohin gehört blau 5?")},
  {type:'quiz',q:T("Kırmızı 7, kırmızı 8, kırmızı 9 nedir?","Red 7, red 8, red 9 is a…","Rot 7, rot 8, rot 9 ist ein(e) …"),opts:[T("Seri","Run","Reihe"),T("Per","Set","Satz"),T("Hiçbiri","Neither","Keins von beiden")],a:0},
  {type:'quiz',q:T("Kırmızı 4, kırmızı 4, mavi 4 per olur mu?","Is red 4, red 4, blue 4 a set?","Ist rot 4, rot 4, blau 4 ein Satz?"),opts:YESNO,a:1}]},
 {title:T("Okeyi joker yap","Using the joker","Den Joker nutzen"),steps:[
  {type:'info',text:T("Eksik taşın yerine okeyi koyabilirsin. Gösterge kırmızı 1 ise okey kırmızı 2'dir: mavi 7, okey, mavi 9 geçerli bir seridir. Sahte okey (★) ise gerçek kırmızı 2 gibi davranır.","You can use the joker for a missing tile. If the indicator is red 1, the joker is red 2: blue 7, joker, blue 9 is a valid run. The false joker (★) then counts as a real red 2.","Der Joker ersetzt einen fehlenden Stein. Ist der Anzeiger rot 1, ist rot 2 der Joker: blau 7, Joker, blau 9 ist eine gültige Reihe. Der falsche Joker (★) zählt dann als echte rote 2.")},
  {type:'okey',mode:'group',goal:'all',ind:'r1',rack:['b7','y3','r2','k3','b9','r3'],text:T("Gösterge kırmızı 1, yani okey kırmızı 2. Grupları kur.","The indicator is red 1, so red 2 is the joker. Build the groups.","Der Anzeiger ist rot 1, also ist rot 2 der Joker. Bilde die Gruppen.")},
  {type:'okey',mode:'group',goal:'all',ind:'r1',rack:['k11','f','r4','b11','r3','y11'],text:T("Sahte okey (★) burada kırmızı 2 yerine geçer. Grupları kur.","Here the false joker (★) counts as red 2. Build the groups.","Hier zählt der falsche Joker (★) als rot 2. Bilde die Gruppen.")}]},
 {title:T("Elini bitir","Finishing","Beenden"),steps:[
  {type:'info',text:T("Elini bitirmek için 14 taşın hepsi per ve serilerden oluşmalı; 15. taşı ortaya atarak bitirirsin. Okeyi atarak bitirirsen puan iki katı olur.","To finish, all 14 tiles must be in sets and runs; you finish by discarding the 15th. Finishing by discarding the joker scores double.","Zum Beenden müssen alle 14 Steine in Sätzen und Reihen liegen; den 15. legst du ab. Wer mit dem Joker beendet, punktet doppelt.")},
  {type:'okey',mode:'discard',rack:['r1','k7','b10','r2','y2','b11','y12','r3','b7','b12','k2','r4','b13','y7','b2'],correct:[6],text:T("Hangi taşı atarsan elin biter?","Which tile do you discard to finish?","Welchen Stein legst du ab, um zu beenden?"),whyWrong:T("O taş bir gruba ait. Hiçbir gruba girmeyen taşı bul.","That tile belongs to a group. Find the one that fits nowhere.","Der Stein gehört zu einer Gruppe. Finde den, der nirgends passt."),success:T("Doğru! Kırmızı 1-2-3-4, mavi 10-11-12-13, 7'li per ve 2'li per kaldı.","Right! Red 1-2-3-4, blue 10-11-12-13, the 7s and the 2s remain.","Richtig! Rot 1-2-3-4, blau 10-11-12-13, die 7er und die 2er bleiben.")},
  {type:'quiz',q:T("Elini bitirmek için kaç taşın gruplarda olması gerekir?","How many tiles must be in groups to finish?","Wie viele Steine müssen zum Beenden in Gruppen liegen?"),opts:['13','14','15'],a:1}]},
 {title:T("Çifte gitmek","Going for pairs","Auf Paare spielen"),steps:[
  {type:'info',text:T("Elinde 7 çift varsa (aynı renk, aynı sayı iki taş) çifte bitebilirsin. Çifte bitmek puanı iki katına çıkarır, ama çifte gittiğini belli edersen rakipler senin taşlarını tutar.","With 7 pairs (two identical tiles each) you can finish with pairs, which scores double. But if others notice, they will hold back the tiles you need.","Mit 7 Paaren (je zwei gleiche Steine) kannst du mit Paaren beenden, das zählt doppelt. Merken die anderen es, halten sie deine Steine zurück."),visual:{kind:'okey',groups:[['r6','r6'],['b9','b9'],['k2','k2']]}},
  {type:'quiz',q:T("Çift nedir?","What is a pair?","Was ist ein Paar?"),opts:[T("Aynı renk, aynı sayı iki taş","Two tiles, same colour and number","Zwei Steine, gleiche Farbe und Zahl"),T("Farklı renk, aynı sayı","Same number, different colours","Gleiche Zahl, andere Farben"),T("Sıralı iki taş","Two consecutive tiles","Zwei aufeinanderfolgende Steine")],a:0},
  {type:'quiz',q:T("Çifte bitmek için kaç çift gerekir?","How many pairs do you need to finish with pairs?","Wie viele Paare brauchst du dafür?"),opts:['5','7','14'],a:1}]}
];
const OKEY101=[
 {title:T("101'in kuralları","How 101 works","So geht 101"),steps:[
  {type:'info',text:T("101 Okey'de taşlar ve okey aynıdır, ama her oyuncu 21 taş alır (başlayan 22). Elini açabilmek için per ve serilerinin toplamı en az 101 puan olmalı. Bir taşın puanı üzerindeki sayıdır.","101 Okey uses the same tiles and joker, but everyone gets 21 tiles (the starter 22). To open, your sets and runs must add up to at least 101 points. A tile is worth its number.","101 Okey nutzt dieselben Steine und Joker, aber jeder bekommt 21 Steine (wer beginnt, 22). Zum Auslegen müssen deine Sätze und Reihen zusammen mindestens 101 Punkte ergeben. Ein Stein zählt seine Zahl.")},
  {type:'quiz',q:T("Elini açmak için en az kaç puan gerekir?","How many points do you need to open?","Wie viele Punkte brauchst du zum Auslegen?"),opts:['51','101','151'],a:1},
  {type:'quiz',q:T("101'de her oyuncu kaç taş alır?","How many tiles does each player get in 101?","Wie viele Steine bekommt jeder bei 101?"),opts:['14','21','22'],a:1}]},
 {title:T("Puan sayma","Counting points","Punkte zählen"),steps:[
  {type:'info',text:T("Bir grubun puanı taşlarının toplamıdır: kırmızı 10-11-12 = 33 puan, sarı 9 + mavi 9 + siyah 9 = 27 puan. Okey, yerine geçtiği taşın puanını alır.","A group is worth the sum of its tiles: red 10-11-12 = 33 points, yellow 9 + blue 9 + black 9 = 27 points. The joker counts as the tile it replaces.","Eine Gruppe zählt die Summe ihrer Steine: rot 10-11-12 = 33 Punkte, gelb 9 + blau 9 + schwarz 9 = 27 Punkte. Der Joker zählt wie der Stein, den er ersetzt."),visual:{kind:'okey',groups:[['r10','r11','r12'],['y9','b9','k9']],showPts:true}},
  {type:'quiz',q:T("Mavi 5-6-7 serisi kaç puan?","How many points is the run blue 5-6-7?","Wie viele Punkte hat die Reihe blau 5-6-7?"),opts:['15','18','21'],a:1},
  {type:'quiz',q:T("Dört renk 13'ten oluşan per kaç puan?","How many points is a set of four 13s?","Wie viele Punkte hat ein Satz aus vier 13ern?"),opts:['13','39','52'],a:2}]},
 {title:T("101'e ulaş","Reach 101","Erreiche 101"),steps:[
  {type:'okey',mode:'group',goal:'points',need:101,showPts:true,rack:['r13','y10','b9','k4','b13','y11','b10','r2','k13','y12','b11','y6'],text:T("Gruplar kurarak en az 101 puana ulaş.","Build groups worth at least 101 points.","Bilde Gruppen mit mindestens 101 Punkten.")},
  {type:'quiz',q:T("Elinde 95 puanlık grup var. Açabilir misin?","Your groups are worth 95 points. Can you open?","Deine Gruppen sind 95 Punkte wert. Darfst du auslegen?"),opts:YESNO,a:1}]},
 {title:T("Çiftle açmak","Opening with pairs","Mit Paaren auslegen"),steps:[
  {type:'info',text:T("101'de en az 5 çiftin varsa elini çiftle de açabilirsin. Çift: aynı renk, aynı sayı iki taş. Çiftle açan oyuncu sonra sadece çift işleyebilir.","In 101 you can also open with at least 5 pairs. A pair is two identical tiles. After opening with pairs, you can only add pairs.","Bei 101 kannst du auch mit mindestens 5 Paaren auslegen. Ein Paar sind zwei gleiche Steine. Danach darfst du nur noch Paare anlegen."),visual:{kind:'okey',groups:[['r8','r8'],['b3','b3'],['y11','y11'],['k6','k6'],['r1','r1']]}},

 {title:T("Hafıza nasıl çalışır?","How memory works","Wie das Gedächtnis arbeitet"),steps:[

     {type:'board',game:'dama',goal:'captureAll',pieces:[pc('a1','K'),pc('a3','M','b'),pc('c5','M','b')],text:TX.capAll,whyWrong:T("Yanlış kareye kondun. İkinci taşla aynı hizada dur.","Wrong landing square. Stop in line with the second piece.","Falsches Landefeld. Bleib in einer Linie mit dem zweiten Stein.")}]},
    {title:T("Alarak dama ol","Crown by capturing","Durch Schlagen Dame werden"),steps:[
     {type:'board',game:'dama',goal:'promote',pieces:[pc('c5','M'),pc('c7','M','b')],text:T("Taşını dama yap.","Get crowned.","Werde Dame."),success:T("Alarak son sıraya ulaştın!","You reached the last row by capturing!","Durch Schlagen die letzte Reihe erreicht!")},
     q3(T("Normal taş geri alabilir mi?","Can a normal piece capture backwards?","Darf ein normaler Stein rückwärts schlagen?"),YESNO,1)]},
    {title:T("Taş tasarrufu","Saving pieces","Steine sparen"),steps:[
     inf(T("Taşlarını yan yana ve arka arkaya tut; tek kalan taş kolayca alınır. Rakibi, almak zorunda kalacağı tuzaklara çek.","Keep your pieces side by side and backed up; a lone piece is easy prey. Lure the opponent into captures that cost them more.","Halte deine Steine zusammen; ein einzelner Stein ist leichte Beute. Locke den Gegner in Schläge, die ihn mehr kosten.")),
     q3(T("Hangisi daha güvenlidir?","Which is safer?","Was ist sicherer?"),[T("Yan yana duran taşlar","Pieces side by side","Steine nebeneinander"),T("Tek başına ilerleyen taş","A piece alone in front","Ein einzelner Stein vorne")],0)]},
    {title:T("Uzun zincir","Long chain","Lange Kette"),steps:[
     {type:'board',game:'dama',goal:'maxCap',need:4,pieces:[pc('a2','M'),pc('a3','M','b'),pc('a5','M','b'),pc('b4','M','b'),pc('c5','M','b'),pc('d6','M','b')],text:T("4 taş alan yolu bul.","Find the route that captures 4.","Finde den Weg mit 4 Schlägen."),whyWrong:T("Bu yol daha kısa. Sağa dönen yolu dene.","That route is shorter. Try turning right.","Dieser Weg ist kürzer. Versuch nach rechts abzubiegen.")}]}
  ],
  [ {title:T("Damanın gücü","The king's power","Die Macht der Dame"),steps:[
     {type:'board',game:'dama',goal:'captureAll',pieces:[pc('h1','K'),pc('h4','M','b'),pc('e6','M','b'),pc('c7','M','b')],text:TX.capAll,whyWrong:T("Zincir koptu. Her almadan sonra bir sonraki taşla aynı hizaya kon.","The chain broke. After each capture, land in line with the next piece.","Die Kette ist gerissen. Lande nach jedem Schlag in Linie mit dem nächsten Stein.")}]},
    {title:T("Eşit yollar","Equal routes","Gleiche Wege"),steps:[
     inf(T("Alma yolları aynı sayıda taş alıyorsa istediğini seçebilirsin. Seçerken sonraki hamlede rakibin sana ne alacağını da düşün.","If routes capture the same number, you may choose. Think about what your opponent can take back next.","Schlagen mehrere Wege gleich viele, darfst du wählen. Denk daran, was der Gegner danach zurückschlagen kann.")),
     q3(T("İki yol da 2 taş alıyorsa ne yaparsın?","Both routes take 2. What do you do?","Beide Wege schlagen 2. Was tust du?"),[T("İstediğimi seçerim","I choose either","Ich wähle frei"),T("Daha kısa olanı seçmeliyim","I must take the shorter","Ich muss den kürzeren nehmen")],0)]},
    {title:T("Oyun sonu","Endgame","Endspiel"),steps:[
     inf(T("Oyun sonunda dama, normal taştan çok daha güçlüdür. Damanı rakip taşla aynı hizaya getir ve arkasında boşluk olduğunda al.","In the endgame a king is far stronger than a man. Bring your king in line with the enemy piece and capture when the square behind is free.","Im Endspiel ist die Dame viel stärker als ein Stein. Bring sie in eine Linie mit dem gegnerischen Stein und schlag, wenn dahinter frei ist.")),
     {type:'board',game:'dama',goal:'captureAll',pieces:[pc('a8','K'),pc('e4','M','b')],text:T("Damanı doğru hatta getir ve taşı al.","Line up your king and capture.","Bring deine Dame in Linie und schlag.")}]},
    {title:T("Beşli zincir","Five in a row","Fünferkette"),steps:[
     {type:'board',game:'dama',goal:'maxCap',need:5,pieces:[pc('a2','M'),pc('a3','M','b'),pc('a5','M','b'),pc('b4','M','b'),pc('c5','M','b'),pc('d6','M','b'),pc('e7','M','b')],text:T("5 taş alan yolu bul.","Find the route that captures 5.","Finde den Weg mit 5 Schlägen."),whyWrong:T("Daha uzun bir yol var. Merdiven gibi düşün: sağa, yukarı, sağa, yukarı.","There's a longer route. Think of a staircase: right, up, right, up.","Es gibt einen längeren Weg. Denk an eine Treppe: rechts, hoch, rechts, hoch.")}]},
    {title:T("Usta bulmaca","Master puzzle","Meisterrätsel"),steps:[
     {type:'board',game:'dama',goal:'captureAll',pieces:[pc('b1','K'),pc('b3','M','b'),pc('d5','M','b'),pc('g5','M','b')],text:TX.capAll,whyWrong:T("Zincir koptu. İkinci taşın sırasına kon.","The chain broke. Land on the second piece's row.","Die Kette ist gerissen. Lande in der Reihe des zweiten Steins.")}]}
  ]],
 tavla:[
  [ {title:T("Kapı yapmak","Making points","Felder bauen"),steps:[
     inf(T("İki pulun durduğu hane kapıdır; rakip oraya gelemez. 3–1 atınca 8'den ve 6'dan oynayıp 5. haneyi kapatmak en iyi açılışlardan biridir.","Two checkers on a point make it yours; the opponent can't land there. With 3–1, playing from 8 and 6 to close point 5 is one of the best openings.","Zwei Steine auf einem Feld machen es zu deinem; der Gegner kann dort nicht landen. Bei 3–1 von 8 und 6 auf Feld 5 zu ziehen ist eine der besten Eröffnungen.")),
     {type:'tavla',goal:'makePoint',point:5,dice:[3,1],text:T("Zar 3–1. 5. haneyi kapı yap.","You rolled 3–1. Make point 5.","Du hast 3–1. Bau Feld 5."),whyWrong:T("5. hane kapanmadı. 8'den 3, 6'dan 1 oyna.","Point 5 isn't closed. Play 8 by 3 and 6 by 1.","Feld 5 ist nicht zu. Zieh von 8 um 3 und von 6 um 1.")}]},
    {title:T("6–1 açılışı","The 6–1 opening","Die 6–1-Eröffnung"),steps:[
     {type:'tavla',goal:'makePoint',point:7,dice:[6,1],text:T("Zar 6–1. 7. haneyi kapı yap.","You rolled 6–1. Make point 7.","Du hast 6–1. Bau Feld 7."),whyWrong:T("13'ten 6, 8'den 1 oynayarak 7'yi kapatabilirdin.","You could close 7 by playing 13 by 6 and 8 by 1.","Mit 13 um 6 und 8 um 1 hättest du Feld 7 gebaut.")},
     q3(T("Kapı neden önemlidir?","Why do points matter?","Warum sind Felder wichtig?"),[T("Rakip oraya gelemez","The opponent can't land there","Der Gegner kann dort nicht landen"),T("Zar iki kat sayılır","Dice count double","Würfel zählen doppelt")],0)]},
    {title:T("Açık pul bırakma","Avoid blots","Keine Blots"),steps:[
     inf(T("Tek başına duran pula açık pul denir; rakip onu kırabilir. Mümkünse hamleni açık pul bırakmadan bitir.","A single checker on a point is a blot; it can be hit. Try to finish your move without leaving blots.","Ein einzelner Stein auf einem Feld ist ein Blot und kann geschlagen werden. Beende deinen Zug möglichst ohne Blots.")),
     {type:'tavla',goal:'noBlots',dice:[4,1],w:{13:4,8:3,6:4,5:1,4:1,24:2},b:{1:2,12:5,17:3,19:5},text:T("Zar 4–1. Hiç açık pul bırakma.","You rolled 4–1. Leave no blots.","Du hast 4–1. Lass keinen Blot stehen."),whyWrong:T("Hâlâ açık pul var. 5'teki ve 4'teki tek pullara bak.","There's still a blot. Look at the single checkers on 5 and 4.","Es gibt noch einen Blot. Schau auf die Einzelsteine auf 5 und 4.")}]},
    {title:T("Gir ve kır","Enter and hit","Einwürfeln und schlagen"),steps:[
     {type:'tavla',goal:'hit',bar:1,dice:[5,2],w:{13:5,8:3,6:6},b:{18:1,24:2,12:4,17:4,19:2,1:2},text:T("Zar 5–2. Kırık pulunu sok ve rakibi kır.","You rolled 5–2. Enter and hit.","Du hast 5–2. Würfle ein und schlag."),whyWrong:T("18'deki tek pulu kırabilirdin.","You could hit the lone checker on 18.","Du hättest den Einzelstein auf 18 schlagen können.")}]},
    {title:T("Çiftle topla","Bear off with doubles","Mit Pasch auswürfeln"),steps:[
     {type:'tavla',goal:'bearoff',need:4,dice:[4,4],w:{4:2,3:3,2:4,1:6},b:{24:5,20:5,19:5},text:T("Zar 4–4. Dört pul topla.","You rolled 4–4. Bear off four checkers.","Du hast 4–4. Würfle vier Steine aus."),whyWrong:T("Zar en uzaktaki pulundan büyükse o pulu toplayabilirsin.","If the die is higher than your farthest checker, bear that one off.","Ist der Würfel höher als dein entferntester Stein, würfle diesen aus.")}]}
  ],
  [ {title:T("Dizi kapı","Building a prime","Eine Blockade bauen"),steps:[
     inf(T("Yan yana kapılar rakibin pullarını hapseder. Altı kapı art arda olursa rakip hiç geçemez.","Points next to each other trap the opponent. Six in a row is a full prime that can't be passed.","Nebeneinanderliegende Felder sperren den Gegner ein. Sechs in Folge kann er gar nicht überwinden.")),
     {type:'tavla',goal:'makePoint',point:5,dice:[4,1],w:{9:2,8:3,7:2,6:3,4:2,13:3},b:{1:2,12:5,17:3,19:5},text:T("Zar 4–1. 5. haneyi kapatıp diziyi tamamla.","You rolled 4–1. Close point 5 to complete the prime.","Du hast 4–1. Schließe Feld 5 und vervollständige die Blockade."),whyWrong:T("5. hane hâlâ açık. 9'dan 4, 6'dan 1 oyna.","Point 5 is still open. Play 9 by 4 and 6 by 1.","Feld 5 ist noch offen. Zieh 9 um 4 und 6 um 1.")}]},
    {title:T("İki zarla kır","Hit with both dice","Mit beiden Würfeln schlagen"),steps:[
     {type:'tavla',goal:'hit',dice:[4,2],w:{24:1,13:5,8:3,6:6},b:{18:1,19:4,12:5,17:3,1:2},text:T("Zar 4–2. 24'teki pulunla 18'deki rakibi kır.","You rolled 4–2. Hit the checker on 18 with your checker on 24.","Du hast 4–2. Schlag mit dem Stein von 24 den Stein auf 18."),whyWrong:T("İki zarı aynı pulla oyna: 24 → 20 → 18.","Play both dice with the same checker: 24 → 20 → 18.","Spiele beide Würfel mit demselben Stein: 24 → 20 → 18.")}]},
    {title:T("Kırmak mı, kapı mı?","Hit or build?","Schlagen oder bauen?"),steps:[
     inf(T("Rakibi kırmak onu geri gönderir ama pulunu açıkta bırakabilir. Kendi iç bölgen güçlüyse kırmak genelde doğrudur, çünkü rakip geri girmekte zorlanır.","Hitting sends the opponent back but may leave you exposed. With a strong home board hitting is usually right, because the opponent struggles to re-enter.","Schlagen schickt den Gegner zurück, kann dich aber verwundbar machen. Mit starkem Heimfeld ist Schlagen meist richtig, weil der Gegner schwer wieder hereinkommt.")),
     q3(T("İç bölgende 5 kapın varsa rakibi kırmak…","With 5 points in your home board, hitting is…","Mit 5 Feldern im Heimfeld ist Schlagen …"),[T("Genelde çok iyidir","Usually very good","Meist sehr gut"),T("Her zaman kötüdür","Always bad","Immer schlecht")],0)]},
    {title:T("Altılı çift","Double sixes","Sechserpasch"),steps:[
     {type:'tavla',goal:'bearoff',need:4,dice:[6,6],w:{6:3,5:3,4:3,3:2,2:2,1:2},b:{24:5,22:5,20:5},text:T("Zar 6–6. Dört pul topla.","You rolled 6–6. Bear off four checkers.","Du hast 6–6. Würfle vier Steine aus.")}]},
    {title:T("Mars","Gammon","Gammon"),steps:[
     inf(T("Rakip hiç pul toplayamadan sen bütün pullarını toplarsan buna mars denir ve oyunu iki kat kazanırsın.","If you bear off all your checkers before the opponent bears off any, that's a gammon and you win double.","Würfelst du alle Steine aus, bevor der Gegner einen draußen hat, ist das ein Gammon und du gewinnst doppelt.")),
     q3(T("Mars kaç sayı kazandırır?","How much is a gammon worth?","Wie viel zählt ein Gammon?"),['1','2','3'],1),
     q3(T("Mars olmamak için ne yapmalısın?","How do you avoid a gammon?","Wie vermeidest du ein Gammon?"),[T("En az bir pul toplamak","Bear off at least one checker","Mindestens einen Stein auswürfeln"),T("Daha çok pul kırmak","Hit more checkers","Mehr Steine schlagen")],0)]}
  ]],
 okey:[

    {title:T("Taş tutmak","Holding tiles","Steine halten"),steps:[

    {title:T("Çifte bitir","Finish with pairs","Mit Paaren beenden"),steps:[

    {title:T("Rakibi okumak","Reading opponents","Gegner lesen"),steps:[

    {title:T("Çiftle açmak","Opening with pairs","Mit Paaren auslegen"),steps:[

     q3(T("Okey bir çiftin eşi olabilir mi?","Can the joker complete a pair?","Kann der Joker ein Paar vervollständigen?"),YESNO,0)]},

 reversi:[

    {title:T("Tehlikeli kareler","Dangerous squares","Gefährliche Felder"),steps:[
     inf(T("Boş bir köşenin çaprazındaki kareye (X-kare) taş koymak rakibe köşeyi hediye edebilir. Köşenin yanındaki kareler (C-kare) de risklidir.","Playing on the square diagonal to an empty corner (an X-square) can hand the corner to your opponent. The squares beside a corner (C-squares) are risky too.","Ein Stein auf dem Feld diagonal neben einer leeren Ecke (X-Feld) kann dem Gegner die Ecke schenken. Auch die Felder neben der Ecke (C-Felder) sind riskant.")),
     q3(T("a1 köşesi boşken hangi kare en tehlikelidir?","With corner a1 empty, which square is the most dangerous?","Welches Feld ist bei leerer Ecke a1 am gefährlichsten?"),['b2','d4','h5'],0)]},
    {title:T("Hareketlilik","Mobility","Mobilität"),steps:[
     inf(T("Az taş çevirmek bazen daha iyidir: rakibin hamle seçeneklerini azaltır, seninkileri artırır. Oyunun başında çok taş toplamak genelde zararlıdır.","Flipping fewer discs is often better: it limits your opponent's moves and keeps yours open. Grabbing many discs early usually hurts.","Wenige Steine umzudrehen ist oft besser: Es schränkt den Gegner ein und hält deine Optionen offen. Früh viele Steine zu sammeln schadet meist.")),
     q3(T("Oyunun başında en çok taşı çeviren hamle her zaman en iyisi midir?","Early on, is the move that flips the most always best?","Ist früh der Zug mit den meisten Umdrehungen immer der beste?"),YESNO,1)]},
    {title:T("Köşe tekrar","Corner again","Wieder die Ecke"),steps:[{type:'reversi',goal:'solve',b:['f3','d2'],w:['g2','e3','d3'],solutions:['h1'],text:TX.best,whyWrong:T("Köşe alınabiliyordu!","The corner was available!","Die Ecke war frei!"),success:T("Köşe senin!","The corner is yours!","Die Ecke gehört dir!")}]},
    {title:T("6×6 maç","6×6 match","6×6-Partie"),steps:[{type:'reversi',goal:'match',size:6,b:['c3','d4'],w:['c4','d3'],ai:'hard',text:TX.play}]}

  [ {title:T("8×8 maç","8×8 match","8×8-Partie"),steps:[{type:'reversi',goal:'match',b:['d5','e4'],w:['d4','e5'],text:TX.play}]},
    {title:T("Parite","Parity","Parität"),steps:[
     inf(T("Oyunun sonunda boş bölgelerde son taşı koyan genelde avantajlıdır. Tek sayıda boş kare kalan bölgelere oynamaya çalış.","At the end, whoever plays the last disc in each empty region usually gains. Aim for regions with an odd number of empty squares.","Am Ende hat meist Vorteil, wer in jeder leeren Region den letzten Stein setzt. Spiele in Regionen mit ungerader Anzahl freier Felder.")),
     q3(T("Bir bölgede 3 boş kare var. Oraya ilk oynamak…","A region has 3 empty squares. Playing there first…","Eine Region hat 3 freie Felder. Dort zuerst zu spielen …"),[T("Genelde iyidir","Is usually good","Ist meist gut"),T("Her zaman kötüdür","Is always bad","Ist immer schlecht")],0)]},
    {title:T("Kenar savaşı","Edge battle","Randkampf"),steps:[{type:'reversi',goal:'solve',b:['b1','c1','d1','c2'],w:['e1','f1','g1','d2'],solutions:['h1'],text:TX.best,whyWrong:T("Köşeyi alıp bütün kenarı çevirebilirdin.","You could take the corner and flip the whole edge.","Du hättest die Ecke nehmen und den ganzen Rand umdrehen können."),success:T("Köşe ve kenar senin!","Corner and edge are yours!","Ecke und Rand gehören dir!")}]},
    {title:T("Güçlü rakip","Strong opponent","Starker Gegner"),steps:[{type:'reversi',goal:'match',b:['d5','e4'],w:['d4','e5'],ai:'hard',text:T("Güçlü bilgisayara karşı oyna.","Play the strong computer.","Spiel gegen den starken Computer.")}]},

     q3(T("Köşedeki taş çevrilebilir mi?","Can a corner disc be flipped?","Kann ein Eckstein umgedreht werden?"),YESNO,1)]}

 go:[
  [ {title:T("Merdiven","The ladder","Die Leiter"),steps:[
     inf(T("Atarideki taş kaçmaya çalışırken her hamlede yeniden atariye düşüyorsa buna merdiven denir; taş kenara kadar kovalanıp yakalanır. Yolda kaçanın taşı varsa merdiven bozulur.","If a stone in atari is put back in atari on every escape attempt, that's a ladder: it's chased to the edge and captured. A friendly stone on the way breaks the ladder.","Wird ein Stein im Atari bei jedem Fluchtversuch erneut ins Atari gesetzt, ist das eine Leiter: Er wird bis zum Rand gejagt und gefangen. Ein eigener Stein auf dem Weg bricht die Leiter.")),
     q3(T("Merdivenin yolunda kaçan tarafın taşı varsa ne olur?","What if the escaping side has a stone in the ladder's path?","Was, wenn der Flüchtende einen Stein im Weg der Leiter hat?"),[T("Merdiven bozulur","The ladder breaks","Die Leiter bricht"),T("Daha hızlı yakalanır","It's captured faster","Er wird schneller gefangen")],0)]},
    {title:T("Üçlü grup","Group of three","Dreiergruppe"),steps:[{type:'go',goal:'captureAll',b:['d6','e6','f6','c5','g5','d4','e4'],w:['d5','e5','f5'],text:TX.capture}]},
    {title:T("Yakalayarak kurtul","Escape by capturing","Durch Fangen entkommen"),steps:[{type:'go',goal:'solve',b:['e5','f6','g5'],w:['e6','d5','f5'],solutions:['f4','e4'],text:T("Siyah taşın atari'de. Kurtar!","Your black stone is in atari. Save it!","Dein schwarzer Stein steht im Atari. Rette ihn!"),whyWrong:T("Taşın hâlâ tehlikede.","Your stone is still in danger.","Dein Stein ist noch in Gefahr."),success:T("Kurtuldun! En güzeli beyaz taşı yakalayarak kurtulmaktı.","Saved! The neatest way is to capture the white stone.","Gerettet! Am schönsten ist es, den weißen Stein zu fangen.")}]},
    {title:T("Gözler","Eyes","Augen"),steps:[
     inf(T("Grubun içindeki boş noktalara göz denir. İki ayrı gözü olan grup asla yakalanamaz, çünkü rakip iki göze aynı anda taş koyamaz.","Empty points inside a group are eyes. A group with two separate eyes can never be captured, because the opponent can't fill both at once.","Leere Punkte in einer Gruppe heißen Augen. Eine Gruppe mit zwei getrennten Augen kann nie gefangen werden.")),
     q3(T("İki gözü olan grup yakalanabilir mi?","Can a group with two eyes be captured?","Kann eine Gruppe mit zwei Augen gefangen werden?"),YESNO,1)]},
    {title:T("Ko","Ko","Ko"),steps:[
     inf(T("Bir taş yakalandıktan sonra rakip hemen geri yakalayıp aynı durumu tekrar oluşturamaz; önce başka bir yere oynamalıdır. Bu kurala ko denir.","After a single-stone capture, the opponent can't immediately recapture to repeat the position; they must play elsewhere first. This is the ko rule.","Nach dem Fangen eines Steins darf der Gegner nicht sofort zurückschlagen und dieselbe Stellung wiederholen; er muss erst woanders spielen. Das ist die Ko-Regel.")),
     q3(T("Ko'da hemen geri yakalayabilir misin?","In a ko, can you recapture immediately?","Darfst du im Ko sofort zurückschlagen?"),YESNO,1)]}
  ],
  [ {title:T("Kenarda büyük grup","Big group on the edge","Große Gruppe am Rand"),steps:[{type:'go',goal:'captureAll',b:['a2','b2','c2','d2'],w:['a1','b1','c1','d1'],text:TX.capture}]},
    {title:T("Çifte atari","Double atari","Doppel-Atari"),steps:[{type:'go',goal:'solve',b:['c5','d6','f6','g5'],w:['d5','f5'],solutions:['e5'],text:T("Tek hamleyle iki beyaz taşı birden atariye düşür.","Put both white stones in atari with one move.","Setz beide weißen Steine mit einem Zug ins Atari."),whyWrong:T("İki taşın ortak özgürlüğüne oyna.","Play on the liberty they share.","Spiele auf die gemeinsame Freiheit."),success:T("Çifte atari! Rakip ikisini birden kurtaramaz.","Double atari! The opponent can't save both.","Doppel-Atari! Der Gegner kann nicht beide retten.")}]},
    {title:T("Köşede yakalama","Capture in the corner","In der Ecke fangen"),steps:[{type:'go',goal:'captureAll',b:['c1','a3','b3'],w:['a1','b1','a2','b2'],text:TX.capture},{type:'go',goal:'captureAll',b:['h9','i7'],w:['i9','i8'],text:TX.capture}]},
    {title:T("Alan sayımı","Counting territory","Gebiet zählen"),steps:[
     inf(T("Oyun bitince çevirdiğin boş noktalar ve yakaladığın taşlar sayılır. Beyaz, ikinci başladığı için birkaç puan (komi) ekstra alır.","At the end, the empty points you surround and the stones you captured are counted. White gets a few extra points (komi) for moving second.","Am Ende zählen das umschlossene Gebiet und die gefangenen Steine. Weiß bekommt für den Nachzug ein paar Extrapunkte (Komi).")),

function poseApply(av,anim,t){
 const {J,rest}=av.userData;for(const k in rest){J[k].rotation.copy(rest[k].r);J[k].position.copy(rest[k].p);}
 if(J.shadow)J.shadow.scale.setScalar(1);

function m_go(q,api,body){
 const n=9,lv=AI_LV[q.round],komi=[0.5,3.5,6.5][q.round];
 let B=Array(n*n).fill(0),hist=[B.join('')],passes=0,moves=0,busy=false,done=false;
 const hd=matchHead(body,q),wrap=h('div',{class:'board-wrap'}),sc=h('span',{class:'pill'}),pass=h('button',{class:'btn ghost sm',onclick:()=>{if(busy||done)return;passes++;hist.push(B.join(''));if(passes>=2)return end();busy=true;status();setTimeout(ai,450);}},t('tPass'));
 body.append(wrap,h('div',{class:'row',style:'justify-content:center;gap:10px'},pass,sc));
 const forbidden=()=>hist.length>=2?hist[hist.length-2]:'';
 const draw=o=>{drawGo(wrap,n,B,Object.assign({onTap},o||{}));const s=goScore(B,n,komi);sc.textContent=t('tScore',{b:s.b,w:s.w});};
 const status=()=>{hd.status.textContent=done?'':busy?t('tThinking'):`${t('mgYourTurn')} · ${t('tKomi',{k:komi})}`;};
 function onTap(i){if(busy||done)return;const r=goPlay(B,n,i,1);if(r.err){SFX.bad();return api.flash(r.err==='taken'?t('goTaken'):t('goIllegal'));}
  if(r.B.join('')===forbidden()){SFX.bad();return api.flash(t('tKo'));}
  B=r.B;hist.push(B.join(''));passes=0;moves++;draw({drop:i,ghost:r.cap});SFX.place();if(r.cap.length)setTimeout(SFX.capture,140);
  busy=true;status();setTimeout(ai,550);}
 function ai(){if(done)return;const i=goAIPick(B,n,forbidden(),lv,moves);
  if(i<0){passes++;hist.push(B.join(''));api.flash(t('tPassed',{who:L(OPP[q.round].n)}));if(passes>=2)return end();busy=false;return status();}
  const r=goPlay(B,n,i,-1);B=r.B;hist.push(B.join(''));passes=0;moves++;draw({drop:i});SFX.place();if(r.cap.length){setTimeout(SFX.capture,140);api.flash(t('tStonesLost',{n:r.cap.length}));}
  if(moves>=170)return end();busy=false;status();}
 function end(){done=true;busy=false;const s=goScore(B,n,komi),win=s.b>s.w;draw();hd.status.textContent=t('tScore',{b:s.b,w:s.w});tFinish(api,win,t(win?'tGoWin':'tGoLose',{b:s.b,w:s.w}),900);}
 draw();status();api.hint(t('goHint'));
}
/* ---------- okey / 101 match (you + 3 computer players) ---------- */
function m_okey(q,api,body,is101){
 const lv=AI_LV[q.round],deck=[];for(const c of OK_CS)for(let v=1;v<=13;v++)deck.push(c+v,c+v);deck.push('f','f');
 let D=shuffle(deck),ind=D.pop();while(ind==='f'){D.unshift(ind);ind=D.pop();}
 const ok=okFromInd(ind),N=is101?21:14;
 const P=[0,1,2,3].map(k=>({hand:D.splice(0,k===0?N+1:N),disc:[],opened:false,name:k===0?t('mgYou'):[L(OPP[0].n),L(OPP[1].n),L(OPP[2].n)][k-1],av:k===0?'🧑':OPP[k-1].e}));
 const table=[];let turn=0,phase='discard',sel=-1,done=false;
 const hd=matchHead(body,q),opps=h('div',{class:'ok-opps'}),mid=h('div',{class:'ok-mid'}),tableEl=h('div',{class:'ogroups'}),rackEl=h('div',{class:'rack ok-rack'}),acts=h('div',{class:'ok-acts'});
 body.append(opps,mid,tableEl,rackEl,acts);
 const me=P[0],prev=()=>P[3];
 const isOkey=x=>okNorm(x,ok).w;
 function sortHand(){me.hand.sort((a,b)=>{const A=okNorm(a,ok),B_=okNorm(b,ok);if(A.w!==B_.w)return A.w?1:-1;return A.c===B_.c?A.n-B_.n:OK_CS.indexOf(A.c)-OK_CS.indexOf(B_.c);});sel=-1;SFX.tap();draw();}
 function draw(){
  opps.innerHTML='';[1,2,3].forEach(k=>{const p=P[k],top=p.disc[p.disc.length-1];opps.append(h('div',{class:'ok-opp'+(turn===k?' on':'')},h('span',{class:'mh-av'},p.av),h('b',{},p.name),h('span',{class:'muted'},t('tTiles',{n:p.hand.length})),p.opened?h('span',{class:'pill ok'},t('tOpenedShort')):null,top?tileEl(top,{small:true}):h('span',{class:'ok-empty'})));});
  mid.innerHTML='';mid.append(h('span',{},t('okInd')),tileEl(ind,{small:true}),h('span',{class:'muted'},t('tCenter',{n:D.length})));
  tableEl.innerHTML='';table.forEach(g=>{const v=okValid(g.codes,ok);tableEl.append(h('div',{class:'ogroup'},h('span',{class:'lbl'},`${P[g.owner].av} ${v?v.points:''}`),okSort(g.codes,ok).map(c=>tileEl(c,{small:true}))));});tableEl.hidden=!table.length;
  rackEl.innerHTML='';me.hand.forEach((x,i)=>{const el=tileEl(x,{btn:true});if(isOkey(x))el.classList.add('okeytile');if(i===sel)el.setAttribute('aria-pressed','true');el.onclick=()=>{if(done)return;sel=sel===i?-1:i;SFX.tap();draw();};rackEl.append(el);});
  acts.innerHTML='';const my=turn===0&&!done,pt=prev().disc[prev().disc.length-1];
  const B_=(label,on,fn,ghost)=>h('button',{class:'btn sm'+(ghost?' ghost':''),disabled:!on,onclick:fn},label);
  if(my&&phase==='draw'){acts.append(B_(t('tDrawTile'),D.length>0,()=>take(false)),B_(t('tTakeSide'),!!pt,()=>take(true)));}
  if(my&&phase==='discard'){
   if(!is101){const fi=okFinishIdx(me.hand,ok);acts.append(B_(t('tDiscard'),sel>=0,()=>discard(sel)),B_(t('tFinish'),sel>=0&&fi.includes(sel),()=>discard(sel,true)));}
   else{const best=!me.opened?okBest(me.hand,ok):null;acts.append(B_(t('tDiscard'),sel>=0,()=>discard(sel)));
    if(!me.opened)acts.append(B_(t('tOpenN',{n:best.pts}),best.pts>=101,()=>{open101(0);if(!me.hand.length)end(0);}));else acts.append(B_(t('tLay'),true,()=>lay101(0)));}}
  acts.append(B_(t('tSort'),true,sortHand,true));
  hd.status.textContent=done?'':turn===0?(phase==='draw'?t('tDrawFirst'):t('tPickDiscard')):`${P[turn].name} · ${t('tAiTurn')}`;
 }
 function take(side){if(turn!==0||phase!=='draw')return;let x;if(side){x=prev().disc.pop();}else{if(!D.length)return end(null);x=D.pop();}me.hand.push(x);sel=me.hand.length-1;phase='discard';SFX.flip();draw();}
 function open101(k){const p=P[k],b=okBest(p.hand,ok);if(b.pts<101)return false;layGroups(k,b);p.opened=true;if(k===0){SFX.promote();api.flash(t('tOpenedPts',{n:b.pts}),'good');draw();}return true;}
 function layGroups(k,b){const p=P[k],ids=new Set();b.groups.forEach(g=>{table.push({owner:k,codes:g.map(i=>p.hand[i])});g.forEach(i=>ids.add(i));});p.hand=p.hand.filter((_,i)=>!ids.has(i));if(k===0)sel=-1;}
 function lay101(k){const p=P[k];const b=okBest(p.hand,ok);if(b.pts>0&&p.hand.length-b.groups.flat().length>=1)layGroups(k,b);
  let moved=true;while(moved&&p.hand.length>1){moved=false;for(let i=0;i<p.hand.length&&p.hand.length>1;i++){for(const g of table){if(okValid([...g.codes,p.hand[i]],ok)){g.codes.push(p.hand[i]);p.hand.splice(i,1);i--;moved=true;break;}}}}
  if(k===0){SFX.pop();draw();}}
 function discard(i,finish){if(turn!==0||phase!=='discard'||i<0)return;const x=me.hand.splice(i,1)[0];me.disc.push(x);sel=-1;SFX.wood();
  if(finish||(is101&&!me.hand.length))return end(0);
  if(is101&&me.opened&&!me.hand.length)return end(0);
  turn=1;draw();setTimeout(aiTurn,650);}
 function aiTurn(){if(done)return;const k=turn,p=P[k],pv=P[(k+3)%4],top=pv.disc[pv.disc.length-1];
  let tookSide=false;
  if(top&&(okUseful(top,p.hand,ok)>=(lv==='hard'?4.5:6)||(!is101&&okFinishIdx([...p.hand,top],ok).length))){p.hand.push(pv.disc.pop());tookSide=true;}
  else{if(!D.length)return end(null);p.hand.push(D.pop());}
  if(!is101){const fi=okFinishIdx(p.hand,ok);if(fi.length&&(lv!=='easy'||Math.random()<.8)){p.disc.push(p.hand.splice(fi[0],1)[0]);return end(k);}}
  else{if(!p.opened)open101(k);if(p.opened)lay101(k);}
  if(!p.hand.length)return end(k);
  const di=okAIDiscard(p.hand,ok,lv);p.disc.push(p.hand.splice(di,1)[0]);
  if(is101&&p.opened&&!p.hand.length)return end(k);
  SFX.flip();turn=(k+1)%4;if(turn===0){phase='draw';}draw();if(turn!==0)setTimeout(aiTurn,650);}
 function end(winner){done=true;draw();hd.status.textContent='';
  if(winner===null)return tFinish(api,false,t('tDeckEmpty'));
  tFinish(api,winner===0,winner===0?t('tYouFinished'):t('tOppFinished',{n:P[winner].name}));}
 sortHand();
}
/* ---------- memory duel ---------- */
function m_memory(q,api,body){
 const r=q.round,pairs=[8,10,12][r],cols=[4,5,4][r],recall=[.35,.65,.92][r];
 const cards=shuffle(shuffle(MM_POOL).slice(0,pairs).flatMap(e=>[e,e])).map((e,i)=>({e,i,up:false,ok:false}));
 const mem=new Map(),sc=[0,0];let turn=0,open=[],busy=false,done=false;
 const hd=matchHead(body,q),score=h('div',{class:'score'}),grid=h('div',{class:'mm',style:`grid-template-columns:repeat(${cols},1fr)`});
 body.append(score,grid);
 const upd=()=>{score.innerHTML='';score.append(h('span',{class:turn===0?'on':''},`🧑 ${sc[0]}`),h('span',{class:turn===1?'on':''},`${OPP[r].e} ${sc[1]}`));hd.status.textContent=done?'':turn===0?t('tYourPick'):`${L(OPP[r].n)} · ${t('tAiTurn')}`;};
 cards.forEach(c=>{c.el=h('div',{class:'card3d'},h('div',{class:'in'},h('div',{class:'bk'}),h('div',{class:'fr'},c.e)),h('button',{'aria-label':String(c.i+1),onclick:()=>{if(turn===0&&!busy)flip(c);}}));grid.append(c.el);});
 const remember=c=>{if(Math.random()<recall+.08)mem.set(c.i,c.e);};
 function flip(c){if(c.up||c.ok||done)return;c.up=true;c.el.classList.add('up');SFX.flip();remember(c);open.push(c);if(open.length<2)return;busy=true;const[a,b]=open;open=[];
  if(a.e===b.e){a.ok=b.ok=true;sc[turn]++;mem.delete(a.i);mem.delete(b.i);setTimeout(()=>{a.el.classList.add('ok');b.el.classList.add('ok');SFX.pop();upd();
    if(sc[0]+sc[1]===pairs)return finish();busy=false;if(turn===1)setTimeout(aiTurn,650);},350);}
  else setTimeout(()=>{a.up=b.up=false;a.el.classList.remove('up');b.el.classList.remove('up');turn=1-turn;busy=false;upd();if(turn===1)setTimeout(aiTurn,650);},950);}
 function aiTurn(){if(done)return;const left=cards.filter(c=>!c.ok);
  const known=[...mem.entries()].filter(([i])=>!cards[i].ok);const byE={};known.forEach(([i,e])=>{(byE[e]=byE[e]||[]).push(i);});
  const pair=Object.values(byE).find(v=>v.length>=2);
  let first=pair&&Math.random()<recall?cards[pair[0]]:pick(left.filter(c=>!mem.has(c.i)).length?left.filter(c=>!mem.has(c.i)):left);
  busy=false;flipAI(first,()=>{const m=[...mem.entries()].find(([i,e])=>i!==first.i&&e===first.e&&!cards[i].ok);
   let second=(pair&&first.i===pair[0])?cards[pair[1]]:(m&&Math.random()<recall?cards[m[0]]:pick(left.filter(c=>c!==first&&!c.up)));flipAI(second);});}
 function flipAI(c,then){setTimeout(()=>{flip(c);if(then)then();},500);}
 function finish(){done=true;upd();const win=sc[0]>sc[1];tFinish(api,win,win?t('tMemWin',{a:sc[0],b:sc[1]}):sc[0]===sc[1]?t('tDraw'):t('tMemLose',{a:sc[0],b:sc[1]}),600);}
 upd();api.hint(t('mmHint'));
}
function m_dispatch(q,api,body){
 const lv=AI_LV[q.round],beat=T("Rakibini yen!","Beat your opponent!","Besiege deinen Gegner!");
 switch(q.game){
  case 'chess':return m_chess(q,api,body);case 'dama':return m_dama(q,api,body);case 'tavla':return m_tavla(q,api,body);
  case 'ludo':return m_ludo(q,api,body);case 'go':return m_go(q,api,body);case 'memory':return m_memory(q,api,body);
  case 'okey':return m_okey(q,api,body,false);case 'okey101':return m_okey(q,api,body,true);
  case 'mangala':matchHead(body,q);return RENDER.mangala({goal:'match',ai:lv,mustWin:true,text:beat},api,body);
  case 'reversi':matchHead(body,q);return RENDER.reversi({goal:'match',ai:lv,mustWin:true,b:['d5','e4'],w:['d4','e5'],text:beat},api,body);
  case 'sudoku':matchHead(body,q);return RENDER.sudoku({n:9,blanks:[40,46,52][q.round],timeLimit:[900,720,600][q.round],maxMiss:3,text:T("Süre bitmeden ve 3'ten fazla hata yapmadan çöz.","Solve it before time runs out, with at most 3 mistakes.","Löse es rechtzeitig mit höchstens 3 Fehlern.")},api,body);
 }
}
Object.assign(RENDER,{tourney:m_dispatch});

/* offline support + automatic updates (iOS keeps home-screen apps alive, so check on every resume) */
if('serviceWorker' in navigator){
 const hadController=!!navigator.serviceWorker.controller;let reloading=false;
 navigator.serviceWorker.addEventListener('controllerchange',()=>{
  if(!hadController||reloading)return;
  if(typeof PS!=='undefined'&&PS){window.__needReload=true;try{toast(t('updatedLater'));}catch(e){}return;}
  reloading=true;location.reload();
 });
 window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{
  const check=()=>reg.update().catch(()=>{});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')check();});
  window.addEventListener('focus',check);
  setInterval(check,20*60*1000);
 }).catch(()=>{});});
}
